# The 'scans' commands of STAC (server/commands — the database of commands is built from
# these declarations). One entry per command; texts in es / en / fr.
area: scans
position: 110
title:
  es: Escaneos
  en: Scans
  fr: Scans
summary:
  es: 'Los escaneos de una sesión: abrir otro, listarlos, fusionarlos.'
  en: 'The scans of a session: open another, list, fuse.'
  fr: 'Les scans d''une session : en ouvrir un autre, les lister, les fusionner.'
commands:
- id: scans.open
  kind: action
  runs_on: ui
  model: Open another scan of the open session, by its date or label (INTERFACE STATE lists the scans).
  args:
    scan:
      type: string
      description: the scan's date (YYYY-MM-DD) or label
      required: true
  needs:
  - session
  text:
    es:
      title: Abrir un escaneo
      say:
      - abrí el escaneo del 31 de agosto
      - cambiá al escaneo 2408
      - abrí el otro escaneo
      done: Abriendo el escaneo {detail}.
    en:
      title: Open a scan
      say:
      - open the scan of August 31
      - switch to scan 2408
      - open the other scan
      done: Opening scan {detail}.
    fr:
      title: Ouvrir un scan
      say:
      - ouvre le scan du 31 août
      - passe au scan 2408
      - ouvre l'autre scan
      done: Ouverture du scan {detail}.
- id: scans.list
  kind: query
  runs_on: ui
  model: Which scans the open session has.
  needs:
  - session
  text:
    es:
      title: Listar los escaneos
      say:
      - qué escaneos tiene la sesión
      - listame los escaneos
      - cuántos escaneos hay
      done: 'Escaneos: {detail}.'
    en:
      title: List the scans
      say:
      - which scans does the session have
      - list the scans
      done: 'Scans: {detail}.'
    fr:
      title: Lister les scans
      say:
      - quels scans a la session
      - liste les scans
      done: 'Scans : {detail}.'
- id: scans.open_fuse
  kind: action
  runs_on: ui
  model: 'Open the window to fuse (merge) the scans of the open session. It only opens the window: the fusion is
    launched by hand.'
  needs:
  - session
  text:
    es:
      title: Abrir la fusión de escaneos
      say:
      - abrí la fusión
      - quiero fusionar los escaneos
      - fusionar escaneos
      done: Ventana de fusión abierta.
    en:
      title: Open the fusion of scans
      say:
      - open the fusion
      - I want to fuse the scans
      - fuse scans
      done: Fuse window open.
    fr:
      title: Ouvrir la fusion des scans
      say:
      - ouvre la fusion
      - je veux fusionner les scans
      - fusionner les scans
      done: Fenêtre de fusion ouverte.
- id: scans.close_tab
  kind: action
  runs_on: ui
  model: 'Close the tab of an open scan (nothing is lost: the list reopens it). Closing the active tab shows the
    neighbouring one.'
  args:
    scan:
      type: string
      description: the scan's date (YYYY-MM-DD) or label; omit for the active tab
  needs:
  - session
  - scan
  text:
    es:
      title: Cerrar la pestaña de un escaneo
      say:
      - cerrá esa pestaña
      - sacá la pestaña activa
      - cerrá la pestaña de la toma anterior
      done: Pestaña cerrada.
    en:
      title: Close a scan's tab
      say:
      - close that tab
      - get rid of the active tab
      - close the tab of the earlier capture
      done: Tab closed.
    fr:
      title: Fermer l'onglet d'un scan
      say:
      - ferme cet onglet
      - enlève l'onglet actif
      - ferme l'onglet de la capture précédente
      done: Onglet fermé.
- id: scans.cycle_tab
  kind: action
  runs_on: ui
  model: Go to the next or the previous open scan tab (Ctrl+Tab); it needs two or more tabs open.
  args:
    direction:
      type: string
      enum:
      - next
      - prev
      required: true
  needs:
  - session
  - scan
  text:
    es:
      title: Pasar a la pestaña siguiente o anterior
      say:
      - pasá a la pestaña siguiente
      - pestaña anterior
      - rotá entre las pestañas
      done: Escaneo {detail}.
    en:
      title: Next or previous scan tab
      say:
      - go to the next tab
      - previous tab
      - cycle through the tabs
      done: Scan {detail}.
    fr:
      title: Onglet suivant ou précédent
      say:
      - passe à l'onglet suivant
      - onglet précédent
      - fais défiler les onglets
      done: Scan {detail}.
- id: scans.set_reference
  kind: action
  runs_on: ui
  model: 'Mark one scan as the composition reference: the one the others are registered on when fusing, and the
    one shown first when the session is opened.'
  args:
    scan:
      type: string
      description: the scan's date (YYYY-MM-DD) or label
      required: true
  needs:
  - session
  text:
    es:
      title: Usar un escaneo como referencia de composición
      say:
      - usá este como referencia de composición
      - marcá la estrella de esa toma
      - que este sea el de referencia
      done: '{detail} es ahora el escaneo de referencia.'
    en:
      title: Use a scan as the composition reference
      say:
      - use this one as the composition reference
      - star that capture
      - make this one the reference
      done: '{detail} is now the reference scan.'
    fr:
      title: Utiliser un scan comme référence de composition
      say:
      - utilise celui-ci comme référence de composition
      - mets l'étoile sur cette capture
      - que celui-ci soit la référence
      done: '{detail} est maintenant le scan de référence.'
- id: scans.fuse
  kind: action
  runs_on: ui
  model: 'LAUNCH the registration and merge from the Fuse window: each chosen scan is registered on the reference
    one through the objects that carry the same label in both, and the merged cloud is built as a new entry of the
    list. Several minutes of server work.'
  confirm: true
  args:
    session:
      type: string
      description: the session's name; omit for the open one
    scans:
      type: array
      items:
        type: string
      description: the scans merged into the reference (date or label)
      required: true
    exclude:
      type: object
      description: per scan, the labels of the object pairs left out of the registration
  needs:
  - session
  text:
    es:
      title: Ejecutar la fusión
      say:
      - registrá y construí la nube fusionada
      - corré el registro de las tomas elegidas
      - lanzala desde su ventana
      done: 'Fusión lanzada: {detail}.'
      ask: 'Voy a lanzar la fusión: {detail}. Varios minutos de trabajo del servidor.'
    en:
      title: Run the fusion
      say:
      - register and build the fused cloud
      - run the registration of the chosen captures
      - launch it from its window
      done: 'Fusion launched: {detail}.'
      ask: 'I am going to launch the fusion: {detail}. Several minutes of server work.'
    fr:
      title: Lancer la fusion
      say:
      - recale et construis le nuage fusionné
      - lance le recalage des captures choisies
      - lance-la depuis sa fenêtre
      done: 'Fusion lancée : {detail}.'
      ask: 'Je vais lancer la fusion : {detail}. Plusieurs minutes de travail du serveur.'
- id: scans.common_points_open
  kind: action
  runs_on: ui
  model: 'Open the Common points window: the same physical point marked on two scans of the project, and the factor,
    the turn and the shift they give between the two scans (to lay one scan on the other and compare them). It only
    opens the window. Not the fusion and not the calibration.'
  needs:
  - session
  text:
    es:
      title: Abrir los puntos comunes
      say:
      - abrí los puntos comunes
      - quiero emparejar las escalas de los dos escaneos
      - marquemos los mismos puntos en las dos tomas
      done: Ventana de puntos comunes abierta.
    en:
      title: Open the common points
      say:
      - open the common points
      - I want to match the scales of the two scans
      - let us mark the same points on both captures
      done: Common points window open.
    fr:
      title: Ouvrir les points communs
      say:
      - ouvre les points communs
      - je veux accorder les échelles des deux scans
      - marquons les mêmes points sur les deux captures
      done: Fenêtre des points communs ouverte.
- id: scans.common_point_mark
  kind: action
  runs_on: ui
  model: 'Mark a common point on the scan on screen: a NEW one, or — by its name (P1, P2 …) — one already marked on
    another scan. It then WAITS for the user to click that point on the model: the point is never guessed.'
  args:
    name:
      type: string
      description: 'the name of an existing common point (P1, P2 …); leave it out for a new point'
  needs:
  - session
  - cloud
  text:
    es:
      title: Marcar un punto común
      say:
      - marcá un punto común nuevo
      - marcá el punto P2 en este escaneo
      - este es el mismo punto que en la otra toma
      done: 'Tocá en el modelo el punto {detail}.'
    en:
      title: Mark a common point
      say:
      - mark a new common point
      - mark point P2 on this scan
      - this is the same point as on the other capture
      done: 'Click on the model the point {detail}.'
    fr:
      title: Marquer un point commun
      say:
      - marque un nouveau point commun
      - marque le point P2 sur ce scan
      - c'est le même point que sur l'autre capture
      done: 'Cliquez sur le modèle le point {detail}.'
- id: scans.common_points_factor
  kind: query
  runs_on: ui
  model: 'Say what the common points give between the scan on screen and the other scan chosen in the Common points
    window: the scale factor, the turn, and the residual. For "what is the factor between the two scans", "how
    well do the two captures match". It reports; it applies nothing.'
  needs:
  - session
  text:
    es:
      title: Qué dan los puntos comunes
      say:
      - qué factor hay entre los dos escaneos
      - cuánto difieren las escalas de las dos tomas
      - qué tan bien coinciden los puntos comunes
      done: 'Puntos comunes: {detail}.'
    en:
      title: What the common points give
      say:
      - what is the factor between the two scans
      - how much do the scales of the two captures differ
      - how well do the common points match
      done: 'Common points: {detail}.'
    fr:
      title: Ce que donnent les points communs
      say:
      - quel est le facteur entre les deux scans
      - de combien diffèrent les échelles des deux captures
      - les points communs concordent-ils bien
      done: 'Points communs : {detail}.'
