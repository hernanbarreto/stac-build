# The 'calibration' commands of STAC (server/commands — the database of commands is built from
# these declarations). One entry per command; texts in es / en / fr.
area: calibration
position: 120
title:
  es: Calibración
  en: Calibration
  fr: Étalonnage
summary:
  es: Calibrar la escala de la nube con medidas reales sobre el modelo 3D.
  en: Calibrating the cloud's scale with real measurements on the 3D model.
  fr: Étalonner l'échelle du nuage avec des mesures réelles sur le modèle 3D.
commands:
- id: calibration.measure_distance
  kind: action
  runs_on: ui
  model: 'Start a calibration by distance: the distance tool is armed and the user picks two points on the 3D model.'
  needs:
  - session
  text:
    es:
      title: Calibrar con una distancia
      say:
      - quiero calibrar con una distancia
      - medida de calibración
      - calibrar la escala
      done: Marca dos puntos sobre el modelo para la medida de calibración.
    en:
      title: Calibrate with a distance
      say:
      - I want to calibrate with a distance
      - calibration measurement
      - calibrate the scale
      done: Pick two points on the model for the calibration measurement.
    fr:
      title: Étalonner avec une distance
      say:
      - je veux étalonner avec une distance
      - mesure d'étalonnage
      - étalonner l'échelle
      done: Marquez deux points sur le modèle pour la mesure d'étalonnage.
- id: calibration.measure_plane
  kind: action
  runs_on: ui
  model: 'Start marking a calibration plane: the user picks three or more points of a plane on the 3D model.'
  needs:
  - session
  text:
    es:
      title: Marcar un plano de calibración
      say:
      - quiero marcar un plano
      - calibración por plano
      - plano de referencia sobre el modelo
      done: Marca tres o más puntos del plano sobre el modelo y pulsa Enter.
    en:
      title: Mark a calibration plane
      say:
      - I want to mark a plane
      - calibration by plane
      - reference plane on the model
      done: Pick three or more points of the plane on the model and press Enter.
    fr:
      title: Marquer un plan d'étalonnage
      say:
      - je veux marquer un plan
      - étalonnage par plan
      done: Marquez au moins trois points du plan sur le modèle et appuyez sur Entrée.
- id: calibration.open
  kind: action
  runs_on: ui
  model: 'Open the Calibration window: the stored calibration and verification measurements and the scale factor.'
  needs:
  - session
  text:
    es:
      title: Abrir la calibración
      say:
      - abrí la calibración
      - mostrá las medidas de calibración
      - está calibrada la nube
      - calibración sobre el modelo 3D
      done: Ventana de calibración abierta.
    en:
      title: Open the calibration
      say:
      - open the calibration
      - show the calibration measurements
      - is the cloud calibrated
      - calibration on the 3D model
      done: Calibration window open.
    fr:
      title: Ouvrir l'étalonnage
      say:
      - ouvre l'étalonnage
      - affiche les mesures d'étalonnage
      - le nuage est-il étalonné
      - étalonnage sur le modèle 3D
      done: Fenêtre d'étalonnage ouverte.
- id: calibration.open_reference
  kind: action
  runs_on: ui
  model: Open the reference window on the keyframe IMAGES (a known distance or a plane marked on a photo).
  args:
    mode:
      type: string
      enum:
      - distance
      - plane
      required: true
  needs:
  - session
  text:
    es:
      title: Referencias sobre las imágenes
      say:
      - abrí la distancia de referencia
      - plano de referencia en las fotos
      done: Ventana de referencias abierta.
    en:
      title: References on the images
      say:
      - open the reference distance
      - reference plane on the photos
      done: Reference window open.
    fr:
      title: Références sur les images
      say:
      - ouvre la distance de référence
      - plan de référence sur les photos
      done: Fenêtre des références ouverte.
- id: calibration.calibrate_readout
  kind: action
  runs_on: ui
  status: manual
  model: 'Turn a distance already measured by hand in the viewer into a calibration (the pin on its readout): the
    Calibration window opens with it as a draft, to fill in its real length.'
  args:
    readout_id:
      type: string
      description: the measured distance's id; omit for the last one measured
  needs:
  - session
  - measurement
  text:
    es:
      title: Calibrar con una distancia ya medida
      say:
      - tocá el pin de la lectura
      - que esa distancia fije la escala
      - mandá la lectura a la ventana de calibración
    en:
      title: Calibrate with a distance already measured
      say:
      - press the pin on the readout
      - let that distance fix the scale
      - send the readout to the calibration window
    fr:
      title: Étalonner avec une distance déjà mesurée
      say:
      - appuie sur l'épingle de la lecture
      - que cette distance fixe l'échelle
      - envoie la lecture à la fenêtre d'étalonnage
- id: calibration.save_distance
  kind: action
  runs_on: ui
  status: manual
  model: 'Store the distance being drafted in the Calibration window: its real length, its uncertainty, its role
    (gauge = it fixes the scale, test = it verifies it), where the length comes from (tape, laser, total station
    or another scan) and a note.'
  args:
    value_m:
      type: number
      minimum: 0
      description: the real length, metres
      required: true
    sigma_m:
      type: number
      minimum: 0
      description: its uncertainty, metres
    role:
      type: string
      enum:
      - gauge
      - test
      description: gauge = it fixes the scale; test = it verifies it
      required: true
    tool:
      type: string
      enum:
      - tape
      - laser
      - total_station
      - other_scan
      description: where the real length comes from
      required: true
    reference_scan:
      type: string
      description: the scan the length was read on, when tool is other_scan
    note:
      type: string
  needs:
  - session
  - measurement
  text:
    es:
      title: Guardar una distancia de calibración
      say:
      - guardala como calibración
      - la longitud real es 2 metros 40
      - guardala con rol de verificación
    en:
      title: Store a calibration distance
      say:
      - save it as a calibration
      - the real length is 2.40 metres
      - save it with the verification role
    fr:
      title: Enregistrer une distance d'étalonnage
      say:
      - enregistre-la comme étalonnage
      - la longueur réelle est de 2,40 mètres
      - enregistre-la avec le rôle de vérification
- id: calibration.save_plane
  kind: action
  runs_on: ui
  status: manual
  model: Store the plane being drafted in the Calibration window (the points marked on the model), with what the
    surface is (floor, wall, table) and a note.
  args:
    label:
      type: string
      description: 'what the surface is: floor, wall, table'
    note:
      type: string
  needs:
  - session
  - measurement
  text:
    es:
      title: Guardar un plano de calibración
      say:
      - guardá el plano marcado
      - la superficie marcada es el piso
      - guardalo con la etiqueta pared
    en:
      title: Store a calibration plane
      say:
      - save the marked plane
      - the marked surface is the floor
      - save it with the label wall
    fr:
      title: Enregistrer un plan d'étalonnage
      say:
      - enregistre le plan marqué
      - la surface marquée est le sol
      - enregistre-le avec l'étiquette mur
- id: calibration.toggle_role
  kind: action
  runs_on: ui
  status: manual
  model: 'Change the role of a stored calibration distance: gauge (it fixes the scale) or test (it verifies the
    scale the others give).'
  args:
    id:
      type: string
      description: the stored distance's id
      required: true
    role:
      type: string
      enum:
      - gauge
      - test
      required: true
  needs:
  - session
  text:
    es:
      title: Cambiar el rol de una distancia guardada
      say:
      - que esa medida verifique
      - que la medida c2 calibre
      - pasá su rol a verificación
    en:
      title: Change the role of a stored distance
      say:
      - make that one verify
      - make distance c2 calibrate
      - switch its role to test
    fr:
      title: Changer le rôle d'une distance enregistrée
      say:
      - passe-la en vérification
      - passe la distance c2 en étalonnage
      - change son rôle
- id: calibration.delete_measurement
  kind: action
  runs_on: ui
  status: manual
  model: DELETE a stored calibration distance of the scan for good (the scale factor is computed again without it).
  confirm: true
  args:
    id:
      type: string
      description: the stored distance's id
      required: true
  needs:
  - session
  text:
    es:
      title: Eliminar una distancia de calibración
      say:
      - eliminá la medida c2
      - borrá esa distancia guardada
      - sacá esa fila de la tabla
    en:
      title: Delete a calibration distance
      say:
      - delete distance c2
      - erase that stored distance
      - remove that row from the table
    fr:
      title: Supprimer une distance d'étalonnage
      say:
      - supprime la distance c2
      - efface cette distance enregistrée
      - retire cette ligne du tableau
- id: calibration.delete_plane
  kind: action
  runs_on: ui
  status: manual
  model: DELETE a stored calibration plane for good.
  confirm: true
  args:
    id:
      type: string
      description: the stored plane's id
      required: true
  needs:
  - session
  text:
    es:
      title: Eliminar un plano de calibración
      say:
      - eliminá el plano p1
      - borrá ese plano guardado
      - sacá esa superficie de la tabla
    en:
      title: Delete a calibration plane
      say:
      - delete plane p1
      - erase that stored plane
      - remove that surface from the table
    fr:
      title: Supprimer un plan d'étalonnage
      say:
      - supprime le plan p1
      - efface ce plan enregistré
      - retire cette surface du tableau
- id: calibration.set_mode
  kind: action
  runs_on: ui
  status: manual
  model: 'Type of calibration of the scan: global (one scale factor for the whole cloud) or axes (one factor per
    axis X, Y, Z; it needs a gauge distance along each axis; a per-axis calibration is a diagnosis, it cannot be
    applied to the scan).'
  args:
    mode:
      type: string
      enum:
      - global
      - axes
      required: true
  needs:
  - session
  text:
    es:
      title: Tipo de calibración
      say:
      - un factor por cada eje
      - un solo factor global
      - cambiá el tipo de factor
    en:
      title: Type of calibration
      say:
      - one factor per axis
      - a single global factor
      - change the kind of factor
    fr:
      title: Type d'étalonnage
      say:
      - un facteur par axe
      - un seul facteur global
      - change le type de facteur
- id: calibration.close
  kind: action
  runs_on: ui
  status: manual
  model: Close the Calibration window (an unsaved draft goes with it).
  needs:
  - session
  text:
    es:
      title: Cerrar la calibración
      say:
      - cerrá la calibración
      - cerrá esa ventana
      - salí de esa tabla
    en:
      title: Close the calibration
      say:
      - close the calibration
      - close that window
      - leave that table
    fr:
      title: Fermer l'étalonnage
      say:
      - ferme l'étalonnage
      - ferme cette fenêtre
      - quitte ce tableau
