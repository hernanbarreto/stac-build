# The 'display' commands of STAC (server/commands — the database of commands is built from
# these declarations). One entry per command; texts in es / en / fr.
area: display
position: 55
title:
  es: Apariencia de la nube
  en: Cloud display
  fr: Affichage du nuage
summary:
  es: 'Cómo se dibuja la escena: sombras, ejes, grilla, cámaras, tamaño y opacidad de los puntos, luz.'
  en: 'How the scene is drawn: shadows, axes, grid, cameras, point size and opacity, light.'
  fr: 'Comment la scène est dessinée : ombres, axes, grille, caméras, taille et opacité des points, lumière.'
commands:
- id: display.shadows
  kind: action
  runs_on: ui
  model: Shadows on or off.
  args:
    'on': &id001
      type: boolean
      required: true
  text:
    es:
      title: Sombras
      say:
      - activá las sombras
      - sacá las sombras
      - sin sombras
      done: Sombras activadas.
      done_off: Sombras desactivadas.
    en:
      title: Shadows
      say:
      - turn the shadows on
      - remove the shadows
      - no shadows
      done: Shadows on.
      done_off: Shadows off.
    fr:
      title: Ombres
      say:
      - active les ombres
      - enlève les ombres
      - sans ombres
      done: Ombres activées.
      done_off: Ombres désactivées.
- id: display.axes
  kind: action
  runs_on: ui
  model: The X Y Z axes shown or hidden.
  args:
    'on': *id001
  text:
    es:
      title: Ejes
      say:
      - mostrá los ejes
      - ocultá los ejes
      done: Ejes visibles.
      done_off: Ejes ocultos.
    en:
      title: Axes
      say:
      - show the axes
      - hide the axes
      done: Axes shown.
      done_off: Axes hidden.
    fr:
      title: Axes
      say:
      - affiche les axes
      - masque les axes
      done: Axes affichés.
      done_off: Axes masqués.
- id: display.grid
  kind: action
  runs_on: ui
  model: The floor grid shown or hidden.
  args:
    'on': *id001
  text:
    es:
      title: Grilla
      say:
      - mostrá la grilla
      - ocultá la grilla
      - sacá la cuadrícula
      - cuadrícula del piso
      done: Grilla visible.
      done_off: Grilla oculta.
    en:
      title: Grid
      say:
      - show the grid
      - hide the grid
      - floor grid
      done: Grid shown.
      done_off: Grid hidden.
    fr:
      title: Grille
      say:
      - affiche la grille
      - masque la grille
      - quadrillage du sol
      done: Grille affichée.
      done_off: Grille masquée.
- id: display.camera_poses
  kind: action
  runs_on: ui
  model: The cameras of the scan (where each keyframe was taken) shown or hidden.
  args:
    'on': *id001
  needs:
  - session
  text:
    es:
      title: Cámaras del escaneo
      say:
      - mostrá las cámaras
      - ocultá las cámaras
      - mostrá el recorrido de la cámara
      - poses de cámara
      done: Cámaras visibles.
      done_off: Cámaras ocultas.
    en:
      title: Scan cameras
      say:
      - show the cameras
      - hide the cameras
      - show the camera path
      - camera poses
      done: Cameras shown.
      done_off: Cameras hidden.
    fr:
      title: Caméras du scan
      say:
      - affiche les caméras
      - masque les caméras
      - affiche le trajet de la caméra
      - poses de caméra
      done: Caméras affichées.
      done_off: Caméras masquées.
- id: display.points_as_cubes
  kind: action
  runs_on: ui
  model: Draw the cloud's points as cubes (on) or as discs (off).
  args:
    'on': *id001
  text:
    es:
      title: Puntos como cubos
      say:
      - dibujá los puntos como cubos
      - puntos como discos
      done: Puntos como cubos.
      done_off: Puntos como discos.
    en:
      title: Points as cubes
      say:
      - draw the points as cubes
      - points as discs
      done: Points drawn as cubes.
      done_off: Points drawn as discs.
    fr:
      title: Points en cubes
      say:
      - dessine les points en cubes
      - points en disques
      done: Points en cubes.
      done_off: Points en disques.
- id: display.point_size
  kind: action
  runs_on: ui
  model: 'Size of the cloud''s points: size = a value from 0.01 to 5, or change = larger | smaller.'
  args:
    size:
      type: number
      minimum: 0.01
      maximum: 5
    change:
      type: string
      enum:
      - larger
      - smaller
  needs:
  - session
  text:
    es:
      title: Tamaño de los puntos
      say:
      - agrandá los puntos
      - puntos más chicos
      - tamaño de punto 2
      done: 'Tamaño de punto: {detail}.'
    en:
      title: Point size
      say:
      - make the points larger
      - smaller points
      - point size 2
      done: 'Point size: {detail}.'
    fr:
      title: Taille des points
      say:
      - agrandis les points
      - points plus petits
      - taille de point 2
      done: 'Taille des points : {detail}.'
- id: display.point_opacity
  kind: action
  runs_on: ui
  model: Opacity of the cloud's points, 0 (transparent) to 1 (opaque).
  args:
    opacity:
      type: number
      minimum: 0
      maximum: 1
      required: true
  needs:
  - session
  text:
    es:
      title: Opacidad de los puntos
      say:
      - hacé la nube más transparente
      - opacidad 0.5
      - nube opaca
      done: 'Opacidad de los puntos: {opacity}.'
    en:
      title: Point opacity
      say:
      - make the cloud more transparent
      - opacity 0.5
      - opaque cloud
      done: 'Point opacity: {opacity}.'
    fr:
      title: Opacité des points
      say:
      - rends le nuage plus transparent
      - opacité 0,5
      - nuage opaque
      done: 'Opacité des points : {opacity}.'
- id: display.light
  kind: action
  runs_on: ui
  model: Intensity of the scene's light, 0 to 2 (1 = normal).
  args:
    intensity:
      type: number
      minimum: 0
      maximum: 2
      required: true
  needs:
  - session
  text:
    es:
      title: Luz de la escena
      say:
      - más luz
      - bajá la luz
      - luz normal
      done: 'Luz: {intensity}.'
    en:
      title: Scene light
      say:
      - more light
      - dim the light
      - normal light
      done: 'Light: {intensity}.'
    fr:
      title: Lumière de la scène
      say:
      - plus de lumière
      - baisse la lumière
      - lumière normale
      done: 'Lumière : {intensity}.'
- id: display.scene_look
  kind: action
  runs_on: ui
  model: 'Open the window of the scene''s look: background and grid.'
  needs:
  - session
  text:
    es:
      title: Fondo y grilla
      say:
      - cambiá el fondo
      - abrí fondo y grilla
      - apariencia de la escena
      - fondo y cuadrícula
      done: Ventana de fondo y grilla abierta.
    en:
      title: Background and grid
      say:
      - change the background
      - open background and grid
      - scene look
      - background and grid
      done: Background and grid window open.
    fr:
      title: Fond et grille
      say:
      - change le fond
      - ouvre fond et grille
      - apparence de la scène
      - fond et grille
      done: Fenêtre du fond et de la grille ouverte.
- id: display.set_precision_layer
  kind: action
  runs_on: ui
  model: 'Show or hide one of the reconstruction''s diagnostic layers over the cloud: flyers (the points flagged
    as flying), mono_detail (the PointDiT detail layer) or mixed_unresolved (the mixed pixels left out of the cloud).'
  args:
    layer:
      type: string
      enum:
      - flyers
      - mono_detail
      - mixed_unresolved
      required: true
    'on':
      type: boolean
      required: true
  needs:
  - session
  text:
    es:
      title: Capas de diagnóstico
      say:
      - prendé la capa de voladores
      - capa de detalle PointDiT
      - píxeles mezclados sin resolver
      done: Capa de diagnóstico visible.
      done_off: Capa de diagnóstico oculta.
    en:
      title: Diagnostic layers
      say:
      - turn on the flyers layer
      - PointDiT detail layer
      - mixed unresolved pixels
      done: Diagnosis layer shown.
      done_off: Diagnosis layer hidden.
    fr:
      title: Couches de diagnostic
      say:
      - active la couche des points volants
      - couche de détail PointDiT
      - pixels mixtes non résolus
      done: Couche de diagnostic affichée.
      done_off: Couche de diagnostic masquée.
- id: display.set_background
  kind: action
  runs_on: ui
  model: 'Kind of background of the viewer (in the Background and grid window): default (the grey gradient), horizon
    (green ground and a sky) or plain (one colour, given as #rrggbb).'
  args:
    kind:
      type: string
      enum:
      - default
      - horizon
      - plain
      required: true
    color:
      type: string
      description: '#rrggbb, for the plain kind'
  needs:
  - session
  text:
    es:
      title: Tipo de fondo
      say:
      - poné el fondo de horizonte con cielo
      - un color liso detrás del modelo
      - gris difuminado predeterminado
      done: Fondo cambiado.
    en:
      title: Kind of background
      say:
      - horizon background with a sky
      - one plain colour behind the model
      - the default grey gradient
      done: Background changed.
    fr:
      title: Type de fond
      say:
      - fond d'horizon avec ciel
      - une couleur unie derrière le modèle
      - dégradé gris par défaut
      done: Fond changé.
- id: display.set_grid_style
  kind: action
  runs_on: ui
  model: 'Style of the floor grid (in the Background and grid window): the cell size in metres (0.1, 0.25, 0.5,
    1, 2 or 5), a major line every 2, 4, 5 or 10 cells, and its colour as #rrggbb.'
  args:
    cell_m:
      type: number
      enum:
      - 0.1
      - 0.25
      - 0.5
      - 1
      - 2
      - 5
      description: cell size, metres
    major_every:
      type: integer
      enum:
      - 2
      - 4
      - 5
      - 10
      description: a major line every this many cells
    color:
      type: string
      description: '#rrggbb'
  needs:
  - session
  text:
    es:
      title: Celdas y color de la cuadrícula
      say:
      - celdas de medio metro
      - línea gruesa cada diez celdas
      - pintá la cuadrícula de azul
      done: Cuadrícula cambiada.
    en:
      title: Cells and colour of the grid
      say:
      - half metre cells
      - a major line every ten cells
      - paint the grid lines blue
      done: Grid changed.
    fr:
      title: Cellules et couleur de la grille
      say:
      - cellules d'un demi-mètre
      - une ligne principale toutes les dix cellules
      - peins les lignes en bleu
      done: Grille changée.
- id: display.reset_scene_look
  kind: action
  runs_on: ui
  model: Put the viewer's background and grid back to their defaults (grey gradient, 1 m cells, a major line every
    10).
  needs:
  - session
  text:
    es:
      title: Restablecer fondo y cuadrícula
      say:
      - restablecé el aspecto predeterminado
      - deshacé los cambios de aspecto
      - como venía de fábrica
      done: Fondo y cuadrícula restablecidos.
    en:
      title: Reset background and grid
      say:
      - restore the default values
      - undo the look changes
      - as it came out of the box
      done: Background and grid reset.
    fr:
      title: Réinitialiser le fond et la grille
      say:
      - rétablis les valeurs par défaut
      - annule les changements d'aspect
      - comme à l'origine
      done: Fond et grille réinitialisés.
- id: display.set_point_budget
  kind: action
  runs_on: ui
  model: 'Detail of the cloud: how many million points the viewer draws at once (2 to 40). More shows more of the
    cloud and asks more of the computer''s graphics card.'
  args:
    millions:
      type: number
      minimum: 2
      maximum: 40
      description: million points drawn at once
      required: true
  needs:
  - session
  - cloud
  text:
    es:
      title: Detalle de la nube
      say:
      - subí el detalle
      - dibujá 20 millones
      - bajá el detalle para que ande más fluido
      done: 'Detalle de la nube: {detail} millones de puntos.'
    en:
      title: Cloud detail
      say:
      - raise the detail
      - draw 20 million
      - lower the detail so it runs smoother
      done: 'Cloud detail: {detail} million points.'
    fr:
      title: Détail du nuage
      say:
      - augmente le détail
      - dessine 20 millions
      - baisse le détail pour plus de fluidité
      done: 'Détail du nuage : {detail} millions de points.'
- id: display.set_confidence_threshold
  kind: action
  runs_on: ui
  model: 'Confidence filter of the viewer: only the points whose confidence is at or above the threshold (0 to 1)
    are drawn; 0 draws every point. Nothing is deleted.'
  args:
    threshold:
      type: number
      minimum: 0
      maximum: 1
      description: 0 to 1
      required: true
  needs:
  - session
  - cloud
  text:
    es:
      title: Filtro de confianza del visor
      say:
      - filtrá por confianza
      - dejá solo lo que supera el 30 por ciento de confianza
      - sacá el filtro de confianza
      done: 'Filtro de confianza: {detail}.'
    en:
      title: Confidence filter of the viewer
      say:
      - filter by confidence
      - keep only what is above 30 percent confidence
      - remove the confidence filter
      done: 'Confidence filter: {detail}.'
    fr:
      title: Filtre de confiance de la visionneuse
      say:
      - filtre par confiance
      - ne garde que ce qui dépasse 30 pour cent de confiance
      - enlève le filtre de confiance
      done: 'Filtre de confiance : {detail}.'
- id: display.set_votes_threshold
  kind: action
  runs_on: ui
  model: 'Threshold of the Votes colouring: the number of agreeing views (0 to 8) from which a point is painted
    green; under it, red.'
  args:
    views:
      type: integer
      minimum: 0
      maximum: 8
      description: agreeing views, 0 to 8
      required: true
  needs:
  - session
  - cloud
  text:
    es:
      title: Umbral de votos
      say:
      - umbral de votos en 3 vistas
      - pintá en rojo lo que tiene menos de 4 vistas
      - subí el umbral de vistas
      done: 'Umbral de votos: {detail} vistas.'
    en:
      title: Votes threshold
      say:
      - votes threshold at 3 views
      - paint red what has fewer than 4 views
      - raise the views threshold
      done: 'Votes threshold: {detail} views.'
    fr:
      title: Seuil des votes
      say:
      - seuil des votes à 3 vues
      - peins en rouge ce qui a moins de 4 vues
      - monte le seuil de vues
      done: 'Seuil de votes : {detail} vues.'
- id: display.hide_below_votes
  kind: action
  runs_on: ui
  model: 'With the Votes colouring: hide (on) or draw again (off) the points under the votes threshold, to see the
    cloud without them. Nothing is deleted.'
  args:
    'on':
      type: boolean
      required: true
  needs:
  - session
  - cloud
  text:
    es:
      title: Ocultar los puntos bajo el umbral de votos
      say:
      - ocultá los puntos por debajo de 3 vistas
      - dejá fuera lo que está debajo del umbral
      - devolvé lo de pocas vistas
      done: Puntos bajo el umbral ocultos.
      done_off: Puntos bajo el umbral visibles.
    en:
      title: Hide the points under the votes threshold
      say:
      - hide the points below 3 views
      - leave out what is under the threshold
      - bring back the low-vote part
      done: Points under the threshold hidden.
      done_off: Points under the threshold shown.
    fr:
      title: Masquer les points sous le seuil des votes
      say:
      - masque les points à moins de 3 vues
      - laisse de côté ce qui est sous le seuil
      - ramène la partie à peu de vues
      done: Points sous le seuil masqués.
      done_off: Points sous le seuil affichés.
