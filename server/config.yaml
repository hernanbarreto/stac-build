# ============================================================================
# STAC-Builder — Server Configuration
# ============================================================================
# Each top-level key is consumed by specific modules. Keys are NOT free-form —
# adding/renaming requires updating the consumer. Don't duplicate sections;
# YAML "last wins" silently masks earlier blocks.
#
# Quick map (consumer → section):
#   main.py                       → server, paths, scene_analysis, bim, fusion
#   workers/map_worker.py         → reconstruction (.backend, .da3, .lidar,
#                                   .mapanything, .gaus_slam, .hybrid)
#   workers/cloudcompy_worker.py  → postprocessing
#   workers/instance_cleaner_*.py → instance_cleaning
#   workers/vlm_worker.py         → scene_analysis
#   semantic/* (client+launcher)  → semantic  (Phase 0 shared VLM service)
#   segmentation/autoprompt/*     → autoprompt (Phase 1 SAM3 auto-prompter)
#   alignment_manager.py          → alignment.auto_leveling
#   frame_selector.py             → frame_selection
#   frames/storage.py             → storage, reconstruction.<backend>.{chunk_size,
#                                   chunk_overlap}
#   fusion_engine.py              → fusion
#   segmentation/sam3_wrapper.py  → models.segmentation
#   segmentation/manager.py       → visualization.segment_colors,
#                                   models.segmentation
#   segmentation/scene_analyzer.py→ scene_analysis (parts)
#   bim/comparison.py             → bim.deviation
#   stray_da3_streaming.py        → reconstruction.lidar.trust_range
# ============================================================================


# ── Server ─────────────────────────────────────────────────────────
server:
  host: "0.0.0.0"
  port: 8765
  static_dir: "../static"   # Relative to server/

# ── Pipeline ───────────────────────────────────────────────────────
pipeline:
  auto_tsdf: false      # false = the pipeline STOPS after the cleaned cloud (see it fast);
                        # the TSDF/texrecon (slow) is triggered manually from the UI.
  # Full semantic chain inside the reconstruct pipeline:
  # VLM scene understanding → SAM3 segment-everything. false = the pipeline runs
  # RECONSTRUCTION → CLOUDCOMPY → TSDF only, and segmentation stays on-demand.
  # TEMPORARILY OFF while the SAM3 session handling is being reworked: a
  # reconstruction re-run must not burn 1h40 in a segmentation we know is wrong.
  auto_segment: false

# ── Paths ──────────────────────────────────────────────────────────
paths:
  output_dir_name: "output"
  # Read at import time by config.py to override DATA_DIR/projects.
  # Use an external mount to save SSD space (e.g. "/mnt/e/stac-projects").
  projects_dir: "/workspace/stac-build/server/projects"


# ── Scene Analysis (VLM auto-inventory) ────────────────────────────
# InternVL3 detects object categories in scan frames. Replaces the manual
# "type a SAM3 prompt" flow when enabled. Consumed by main.py and
# segmentation/scene_analyzer.py.
scene_analysis:
  enabled: false
  model_id: "OpenGVLab/InternVL3-8B"
  max_tiles: 6                         # 6 = dev/12GB · 12 = production/24GB
  max_merged_categories: 25

  prompt: |
    <image>
    You are a spatial analyst for 3D scanning. Identify every physical object and surface visible.

    Categories to look for:
    - Surfaces: wall, floor, ceiling, staircase
    - Openings: door, window
    - Furniture: chair, table, couch, shelf, cabinet, bed, desk
    - Fixtures: radiator, light fixture, outlet, switch, sink, toilet
    - Installations: pipe, duct, conduit, cable tray, electrical panel
    - Construction: column, beam, slab, rebar, formwork, scaffold
    - Finishes: tile, cladding, insulation, carpet, paint
    - Other: any distinct physical object not listed above

    For each element provide:
    - "label": 1-2 word generic name (lowercase, e.g. "chair", "floor")
    - "sam3_hint": 2-3 word specific phrase (include material/color/feature)

    Rules:
    1. Return JSON array: [{"label": "...", "sam3_hint": "..."}, ...]
    2. Max 20 entries — no duplicates, no synonyms
    3. ALWAYS include floor, wall, ceiling if visible
    4. Ignore people, small tools, trash

    Output ONLY the JSON array.

  merge_prompt: |
    Merge these object lists from {n_frames} views into one unified inventory.

    {categories_per_frame}

    Rules:
    1. Merge duplicates and synonyms (e.g. "wooden chair" + "chair" = "chair")
    2. Max {max_categories} entries — prioritize items seen in most frames
    3. MANDATORY: floor, wall, ceiling if detected in any frame
    4. Keep the best sam3_hint for each merged category
    5. Return JSON array of {{"label": "...", "sam3_hint": "..."}} objects

    Output ONLY the JSON array.

  required_categories:
    - { label: "floor" }
    - { label: "wall" }
    - { label: "ceiling" }


# ── Findings (Phase 3) — 3D-anchored visual inspection ─────────────
# Over sampled keyframes Qwen3-VL reports ONLY clearly visible defects (strict
# JSON). Each 2D detection is anchored to 3D through the R-refined pose, the
# owning R.8 instance is resolved by mask coverage, multi-view duplicates are
# merged by type + 3D proximity, and a LOCALIZED point-to-cloud residual (proxy
# for a surface_fitting residual map) raises severity where the surface is
# actually rough. VLM proposes/describes, never measures; every finding is born
# "proposed" and needs human validation. Consumed by phase3_findings/*.
phase3:
  enabled: true
  backend: "qwen_local"
  sample_stride: 1                    # keyframe subsampling (over frames with instances)
  max_frames: 60                      # cap on inspected keyframes (cost)
  min_confidence: 0.35                # drop low-confidence detections
  cluster_radius_m: 0.30              # multi-view dedup + on-cloud gate (metres)
  residual_k: 12                      # neighbours for the local plane-residual proxy
  residual_thresh_m: 0.02             # residual above this -> correlate + bump severity
  max_depth_m: null                   # optional depth clip for anchoring


# ── Capture QC (Phase 4) — ingestion pre-filter + coverage report ──
# 4A runs BEFORE DA3/VGGT: cheap classical metrics on every sampled frame
# (Laplacian-variance blur + exposure); the VLM is invoked ONLY on the ambiguous
# band (borderline blur / suspicious exposure) to judge blur, occlusion by
# people/equipment, exposure and usefulness. Frames are NEVER deleted — a
# manifest + drop-log record which and why. 4B runs AFTER reconstruction: finds
# under-sampled zones in the pooled cloud, recovers the frames that view each,
# and emits a natural-language recapture checklist. Consumed by phase4_qc/*.
phase4:
  enabled: true                       # disableable; when off, no frame is filtered
  sample_stride: 1                    # frame subsampling for the pre-filter
  escalate_to_vlm: true               # false -> classical only, ambiguous kept+flagged
  blur_keep_above: 120.0              # Laplacian variance: clearly sharp -> keep (no VLM)
  blur_drop_below: 25.0               # clearly blurred -> drop (no VLM, logged)
  brightness_lo: 40.0                 # mean-luma acceptable band (0..255)
  brightness_hi: 220.0
  clip_frac_max: 0.25                 # max fraction of clipped pixels before escalation
  # 4B coverage
  voxel_size_m: 0.10                  # density voxel grid
  low_density_pct: 20.0               # bottom-percentile component size = under-sampled
  min_zone_points: 20                 # floor: discard single-stray-point noise
  max_zone_fraction: 0.5              # a component above this share is the main body
  max_zones: 12
  describe: true                      # VLM phrases the recapture instruction per zone


# ── Report generation (Phase 6) — bilingual supervision draft ──────
# Assembles inventory (Ph2) + findings (Ph3) + measurements (Ph5 tools) +
# coverage (Ph4) + reconstruction-quality (Phase R) into a traceable Markdown
# report with figures. Every number carries its tool+args+timestamp trace; every
# VLM observation is marked "proposal pending validation" unless human-validated.
# The generator measures nothing itself. Consumed by phase6_report/*.
phase6:
  lang: "es"                          # default language: es | fr (CLI can emit both)


# ── Auto-prompter (Phase 1) — Qwen3-VL grounded detection -> SAM3 ───
# Replaces manual SAM3 prompting as the DEFAULT: detect boxes+labels with
# Qwen3-VL, associate the same object across keyframes by BA-pose geometry, and
# pre-populate a segmentation session for human review. Its batch CLI is the
# masklet producer for Phase R. Consumed by segmentation/autoprompt/* and
# (as the default inventory path) workers/vlm_worker.py.
# ── Instance post-processing (mask→cloud stage) ──────────────────────────
segmentation:
  merge_duplicates: false     # OFF. Both merges (index overlap + same-space voxel dedupe)
                              # test CONTAINMENT, not identity: they divide the intersection
                              # by the SMALLER instance's size, so a wall/floor/train body
                              # absorbs every sign, panel and wheel resting against it, and
                              # the absorber's envelope keeps growing (largest-first cascade).
                              # That is what collapsed 147 instances to 3-4. Distinct objects
                              # stay distinct; SAM3's tracking is the identity.
  dedupe_voxel_m: 0.05        # voxel size, only used when merge_duplicates is true
  dedupe_overlap: 0.5         # overlap fraction, only used when merge_duplicates is true
  min_instance_points: 300    # drop mask slivers below this point count (not objects)

autoprompt:
  enabled: true                       # default path; false -> InternVL3 fallback
  backend: "qwen_local"               # semantic-service backend
  understand: true                    # comprehend the scene first; drives detection
  understand_sample: 8                # keyframes sampled for scene understanding
  vocabulary_path: null               # null -> segmentation/autoprompt/vocabulary.yaml
                                      # (canonicalization/routing overlay, NOT a filter)
  confidence_threshold: 0.5           # below (per-class overridable) -> review queue
  association_iou_threshold: 0.25     # reprojected-box IoU to link across keyframes
  use_depth: true                     # use DA3/VGGT per-frame depth if present
  assumed_depth_m: 5.0                # fallback lift depth when none available
  max_keyframes: 0                    # 0 = all selected keyframes (hard override)
  # Adaptive VLM sampling: the grounded detector only sees keyframes where the
  # camera actually MOVED (new viewpoint = new detection opportunity); SAM3
  # propagates the masklets to every frame afterwards. Scales with the scan
  # (short room ≈ dozens of VLM calls, long corridor ∝ metres walked) instead
  # of one call per frame.
  adaptive_sampling:
    enabled: true
    min_spacing_m: 0.15               # keep a frame after ≥ this camera travel
    min_rotation_deg: 10              # … or ≥ this camera rotation
    min_frames: 48                    # floor. Phase R needs masklet coverage in EVERY
                                      # window: test2 with the old 0.4m/18°/floor-12 gave
                                      # 15 VLM frames over 11 windows → 5 OBB edges,
                                      # 0 primitive edges → no anchoring evidence at all.
                                      # ~4-5 mask frames per 120-frame window is the target.
    max_frames: 0                     # optional ceiling (0 = none)
    no_pose_target: 48                # even subsample when no BA poses exist


# ── Semantic Service (Phase 0) ─────────────────────────────────────
# The single persistent VLM endpoint (vLLM serving Qwen3-VL) shared by every
# downstream consumer (Phases 1-6). Runs in its OWN conda env `semantic`;
# reached only through the semantic_client HTTP client (server/semantic/).
# Consumed by: server/semantic/* (launcher + client). Launch:
#   bash scripts/serve_semantic.sh [backend]
semantic:
  enabled: true

  service:
    host: "127.0.0.1"
    port: 8799                 # OpenAI-compatible endpoint: http://127.0.0.1:8799/v1
    api_key: "EMPTY"           # vLLM ignores it; the OpenAI wire format needs a value
    startup_timeout_s: 900     # weights load can be slow off the network volume
    request_timeout_s: 600

  default_backend: "qwen_local"

  # One vLLM process serves ONE model at a time. The comparison suite (Phase 7)
  # serves each backend in turn. gpu_memory_utilization is the TOTAL fraction of
  # the 48 GB A6000 vLLM may use (weights + KV cache), chosen to coexist with
  # the reconstruction pipeline — start ~0.35 and adjust by MEASURING (spec).
  backends:
    qwen_local:                          # baseline — exact variant R3D uses
      model_id: "Qwen/Qwen3-VL-8B-Instruct"
      served_model_name: "qwen_local"
      weights_path: "weights/qwen3vl/8b-instruct"
      # MEASURED (A6000 48 GB): 8B bf16 weights ≈16 GiB. At util 0.45 only
      # 2.33 GiB KV remained (max len ≈16.9k) — the spec's 0.35 start is
      # infeasible for the 8B. 0.50 (≈24 GiB) is the working floor for a 24k
      # context and leaves ~24 GiB for the reconstruction pipeline.
      gpu_memory_utilization: 0.50
      max_model_len: 24576
      max_images_per_prompt: 8
      dtype: "bfloat16"                  # A6000 sm_86 native bf16
      tool_call_parser: "hermes"         # Qwen3 native tool-calling (vLLM rec.)
      reasoning: false                   # -Instruct is non-thinking
      extra_serve_args: []

    qwen_local_large:                    # candidate — larger quantized (Phase 7)
      model_id: "Qwen/Qwen3-VL-32B-Instruct-FP8"
      served_model_name: "qwen_local_large"
      weights_path: "weights/qwen3vl/32b-instruct-fp8"
      gpu_memory_utilization: 0.80
      max_model_len: 24576
      max_images_per_prompt: 6
      tool_call_parser: "hermes"
      reasoning: false
      extra_serve_args: []

  generation:
    temperature: 0.0            # deterministic — measurements must be repeatable
    max_tokens: 2048

  tool_calling:
    max_iterations: 8           # bound the Q&A tool loop (Phase 5)

  logging:
    enabled: true
    jsonl_path: "logs/semantic_calls.jsonl"   # every call: consumer/prompt/imgs/response/latency


# ── Frame Selection params (mode is reconstruction.frames_selector) ─
# These are the SUB-PARAMS for the selector mode chosen in
# reconstruction.frames_selector (dino | stride | none). Consumed by
# frames/selector.py, triggered in workers/map_worker.py step 2.
frame_selection:
  # DINO settings (used when frames_selector: dino)
  dino_model: "dinov2_vitb14"          # ViT-B/14 ~330MB, same as VGGT-Long
  dino_threshold: 0.99                  # cosine sim threshold: a frame becomes a keyframe once its
                                       # similarity to the last keyframe drops BELOW this → HIGHER =
                                       # MORE keyframes = denser overlap. 0.99 = light dedup: drops only
                                       # near-identical frames (the worst cebolla offenders) but keeps
                                       # dense overlap → DA3 backbone alignment + loops intact. NO DA3
                                       # needed to select (DINO is image-only) → no circular dependency.
  dino_threshold_dense: 0.99           # DA3's DENSER set (da3_frames.json): keyframes + the extra
                                       # inter-keyframe frames that add coverage, DEDUPED. DA3 runs on
                                       # THIS (0.99); MapAnything uses the 0.98 keyframes above. The
                                       # extra frames (0.99 \ 0.98) get their poses refined by ICP
                                       # (dense_fusion) and feed the TSDF as DA3 depth.
  dino_device: "cuda"                  # "cuda" | "cpu" (auto-falls back)

  # ── PARALLAX (geometric) keyframe selection — used when frames_selector: parallax ──
  # For the SLAM backbone (MapAnything), keyframes by TRIANGULATION ANGLE (baseline), not
  # appearance. Needs DA3 per-frame metric depth+pose (DA3 runs on all blur-valid frames
  # first). Cosine stays for DA3's dense set. Pure rotation → no baseline → aborts.
  theta_parallax: 1.5                  # deg: new keyframe once the MEDIAN triangulation angle
                                       # vs the last keyframe reaches this (SLAM uses ~1-2°).
  overlap_min: 0.5                     # force a keyframe if overlap with the last drops below…
  min_baseline_m: 0.05                 # …but ONLY with real camera translation, so pure rotation
                                       # (baseline≈0) never forces a degenerate (un-triangulable) kf.
  min_global_baseline_m: 0.3           # if the WHOLE clip's max camera displacement < this →
                                       # pure rotation / no parallax → ABORT (cannot reconstruct).
  min_keyframes_pct: 0.015             # min keyframes = max(floor, pct × #frames) → ABORT below it.
  min_keyframes_floor: 8               # a PERCENTAGE (not a fixed 20) so the bar scales with capture
                                       # length: 251 frames → max(8,4)=8; 1500 → 23; 3000 → 45.
                                       # (not enough geometric coverage to reconstruct).
  parallax_stride: 8                   # sub-sample every Nth pixel for the angle median.

  # Legacy H/F ratio (used if method=hf_ratio or DINO fails)
  max_features: 2000
  sigma: 1.0
  process_scale: 0.25
  hf_ratio_threshold: 0.45             # ORB-SLAM default
  min_displacement: 3.0
  force_accept_interval: 30            # Force accept every N frames as safety net

  # ── Anchor rescue: fill long REAL-frame gaps left by motion-blur pans ──
  # The blur filter + DINO select over blur-VALID frames only, and the force-accept
  # interval counts in that decimated list — so a fast pan that motion-blurs a whole
  # stretch is invisible to it and leaves a big gap in the REAL video timeline
  # (e.g. 126 frames ≈ 4s in test7) with no keyframe → low overlap between the
  # surrounding keyframes → reconstruction backbone can drift / lose tracking.
  # When a real-frame gap exceeds max_gap_frames, graft the SHARPEST frame in it
  # (looking at blur-REJECTED frames too) as an anchor — but only if it clears
  # rescue_min_sharpness_frac of the blur threshold. If nothing clears it (the
  # whole pan is unusable mush), leave the gap and log it rather than inject a
  # frame so blurry it would poison matching.
  max_gap_frames: 45                   # 0 disables. ~1.5s @30fps. Real-frame gap above
                                       # which we try to rescue an anchor.
  rescue_min_sharpness_frac: 0.6       # min sharpness of a rescued frame, as a fraction of the
                                       # blur threshold (worst of laplacian/fft). Below it → leave the gap.


# ── Models: Segmentation (SAM 3 / SAM 3.1) ─────────────────────────
models:
  segmentation:
    version: "sam3.1"                  # "sam3" | "sam3.1" (Object Multiplex). 3.1 measured on
                                       # test3 (A100): 0.144 s/frame vs 0.884 (6.1x faster),
                                       # equivalent masks; VRAM 23.5 GB (multiplex buckets) vs 6.4.
                                       # Rollback = set "sam3" (vendor/sam3 checkout kept) + restart.
    device: "cuda"

    # SAM 3.1 Multiplex
    multiplex_count: 16                # objects per multiplex bucket (8 if <12GB VRAM)
    max_num_objects: 32
    compile: false                     # torch.compile (~2x speedup, warmup time)
    use_fa3: false                     # FlashAttention 3 (requires flash-attn-3)
    checkpoint_path: null              # null = auto-download from HuggingFace

    # Inference
    keyframe_interval: 2
    max_search_frames: 300
    points_per_side: 32
    pred_iou_thresh: 0.88
    stability_score_thresh: 0.95
    prompt_search_frames: [0, 15]      # frames to apply prompt (relative to chunk start)

    # Batched processing (memory management for long videos)
    batch_size: 250                    # ≥ sampled frame count → ONE SAM3 session per
                                       # concept = SAM3's own tracking is the identity
                                       # (cross-batch ID stitching is unreliable; avoid it)
    batch_overlap: 10
    iou_match_threshold: 0.3

    # Per-segment cleaning (voxel grid + local PCA + depth peeling)
    segment_cleaning:
      enabled: true
      voxel_size: 0.005                # 5mm cell — fallback for curved surfaces
      min_points_per_voxel: 5
      planarity_threshold: 0.3         # λ₃/λ₁ — below this = planar → depth peel
      layer_tolerance: 0.005           # ±5mm of densest layer
      histogram_bins: 50
      dbscan_enabled: true
      dbscan_min_samples: 10
      sor_k: 20
      sor_std: 1.5
      mad_multiplier: 3.0
      ransac_enabled: false            # face detection (deforms non-planar objects)
      ransac_tolerance: 0.01
      min_face_points: 100
      max_faces: 8
      face_thickness: 0.01
      mesh_voxel_size: 0.05            # visualization voxel size


# ── Alignment (auto-leveling) ──────────────────────────────────────
alignment:
  auto_leveling:
    enabled: true
    ransac_iters: 500
    ransac_threshold: 0.05
    min_points: 100
    sample_ratio: 0.1
    gravity_check_threshold: 0.5
    target_gravity: [0.0, 1.0, 0.0]


# ── Storage & Filtering ────────────────────────────────────────────
storage:
  jpeg_quality: 95

  outlier_removal:                     # frames/storage.py global outlier filter
    enabled: false
    eps: 0.05
    min_samples: 10
    sor_k: 20
    sor_std_ratio: 2.0


# ── Fusion Engine (visualization) ──────────────────────────────────
# Default intrinsics for client-side viewport overlays when no real K is
# available (mostly fallback). Consumed by fusion_engine.py.
fusion:
  min_depth: 0.1
  max_depth: 50.0
  downsample_factor: 2
  buffer_size: 30
  intrinsics:
    fx: 1000.0
    fy: 1000.0
    cx: 640.0
    cy: 360.0


# ── Visualization ──────────────────────────────────────────────────
visualization:
  segment_colors:
    - "#FFFF00"
    - "#00FF00"
    - "#FF00FF"
    - "#00FFFF"
    - "#FF8000"
    - "#8000FF"
    - "#FF0080"
    - "#0080FF"


# ── BIM / IFC ──────────────────────────────────────────────────────
bim:
  supported_formats: [".ifc", ".rvt"]

  comparison:
    alignment_method: "icp"            # "icp" | "manual" | "control_points"
    icp_max_iterations: 50
    icp_convergence_threshold: 0.001

  deviation:
    tolerance_mm: 50                   # main C2M deviation threshold
    method: "point_to_surface"         # "point_to_surface" | "point_to_point"
    # Display heatmap thresholds (mm)
    warning_threshold: 10.0
    error_threshold: 20.0
    critical_threshold: 30.0
    # Sábana (deviation heatmap point cloud)
    sabana:
      point_size_mm: 3.0               # render point size
      uncovered_alpha: 0.25            # alpha for non-scanned BIM mesh areas
      subsample_mm: 1.0                # 0 = raw, else downsample to this spacing
    # Coverage proximity (separate from deviation accuracy)
    coverage_proximity_m: 0.15         # 15cm — generous for thick walls/slabs
    # Quality classification thresholds (% of points within tolerance)
    quality:
      good_threshold: 80               # >=80% within tol = GOOD (green)
      regular_threshold: 50            # >=50% = REGULAR (yellow), else BAD


# ── Whole-scene TSDF mesh ──────────────────────────────────────────
# Consumed by workers/tsdf_worker.py → segmentation/tsdf_export.export_tsdf_scene.
# PHILOSOPHY: the cleaned_cloud already passed ALL filters (confidence, SOR, voxel,
# in cloudcompy) → it is the source of truth. The TSDF must TRUST it and mesh
# EVERYTHING in it — NO extra re-filtering. So mask to the cloud and disable the
# per-frame cutoffs (distance / confidence / weight / edge) that were dropping real
# surfaces (distant walls/doors) that show fine in the cloud.
tsdf:
  mask_to_cleaned_cloud: true  # integrate EXACTLY the cloud's pixels (the source of truth)
  # FAITHFUL cloud-raster integration: z-buffer the cleaned_cloud's OWN points back into
  # each frame and integrate THAT, instead of the raw neural depth. The raw depth still
  # carries the flying-pixel/far-phantom returns that CloudCompPy's SOR + noise filter
  # already stripped from the cloud — integrating it made the mesh grow streaks and
  # phantom surfaces the cloud doesn't have ("no copia la nube" / "líneas incorrectas").
  # With raster ON every depth sample IS a cleaned cloud point → the mesh copies the cloud.
  rasterize_cloud_depth: false # DENSE depth (solid continuous surface). Raster z-buffered sparse
                              # cloud points → 3.5M disconnected fragments (dust) + 83m bridge tris on
                              # test4 — wrong technique here. Dense gives ONE connected surface.
                              # points back into each frame and integrate THAT. Unlike raw dense
                              # depth (capped at reliable_depth_m=8m by auto_tune → drops the far
                              # half of long scans seen from >8m away, the test4 missing-tail bug),
                              # the clean cloud has no far-noise, so auto_tune opens depth_trunc to
                              # the full cloud diagonal → the WHOLE cloud meshes. Tradeoff: sparse
                              # regions can fragment into patches — raise cloud_splat_radius if so.
  cloud_splat_radius: 1        # (moot in dense mode) px splat (same z) — fills single-point gaps
                              # coverage matches the cloud's surface density. 2 (was 1) closes
                              # the pinhole gaps raster leaves between sparse projected points →
                              # fewer "cloud-here-but-no-mesh" holes in the near zone.
  conf_min_norm: 0            # OFF this run — no confidence filtering anywhere (postprocessing
                              # conf_min_norm is also 0). The literature-driven experiment: with
                              # blur+DINO+asymmetric reconstruction, SEE the raw cloud quality
                              # before re-introducing any gate. (Also avoids double-filtering once
                              # CloudCompy gates at source.)
  cleaned_cloud_dilate: 1     # tightened 3→1 to hug the cloud (dilate 3 leaked lateral X/Y pixels
                              # beyond the cloud → ~24% of TSDF verts outside the cloud bbox).
                              # legacy raw-depth path only (ignored when raster is on)
  depth_trunc: 100.0         # UPPER bound; auto_tune caps it to reliable_depth_m (8m). With auto_tune ON this is
                             # tightened per-scene to reliable_depth_m (far neural depth is noisy).
  depth_min: 0.05            # only drop sensor-touching artifacts
  # ── AUTO-TUNE: adapt scale-sensitive params to the scene (measured from the cloud) ──
  # A fixed config can't serve a 5m room AND a 26m corridor. Before integrating, measure the
  # cloud's extent and tighten depth_trunc + scale decimate_target accordingly.
  auto_tune: true
  reliable_depth_m: 15.0     # 30→15: clip the far Z tail (omega depth p95≈15m; cloud reaches ~12m).
                             # 30 let the >15m noise mesh → Z spill past the cloud. (test2 scene.)
                             # was 8 → cut depth_trunc to 8m and DROPPED the far tail (cloud reaches
                             # 106m, far surfaces are seen from ~18-30m away → never integrated =
                             # "partes faltantes"). 30m lets the far half mesh as a SOLID surface.
                             # Tradeoff: far depth a bit fuzzier; weight_thresh+edge_thresh+max_edge
                             # still guard flying pixels/bridges. Lower toward ~20 if far walls thicken.
                             # neural depth reliable to ~8m → auto_tune caps depth_trunc here.
                             #          this. 150 fused noisy far depth → fuzzy/streaky. cameras stop at
                             # Z76.8, cloud goes to 106, seen from ~18-30m) so the far half integrates as a
                             # SOLID surface. Far depth is a bit fuzzier but it's a surface, not missing.
                             # capped to min(this, depth_trunc) so far NOISY depth isn't fused (the
                             # "fuzzy/thick walls on big scenes" fix). Raise if depth stays sharp far.
  max_decimate: 4000000      # ceiling for the auto-scaled decimate_target. Big scenes scale UP from
                             # decimate_target (∝ scene diagonal) so they keep detail, up to this cap.
  da3_conf_percentile: 0     # raster mode: moot (cloud already filtered); legacy: conf re-filter
  tsdf_weight_thresh: 2.0    # back to 2 for DENSE depth: drops single-view flying pixels at
                             # silhouettes (the real "lines in the middle"). (1.0 was only safe in raster.)
                             # the middle" — single-view FLYING PIXELS from RAW neural depth at
                             # silhouette edges. BUT in raster mode (rasterize_cloud_depth: true)
                             # the integrated depth IS the already-clean cloud, so there are NO
                             # flying pixels to drop — requiring 2 views then just DELETES real
                             # surface the cloud captured from a single frame (grazing/edge/far
                             # coverage) → "cloud-here-but-no-mesh" holes. With raster, weight=1 is
                             # both safe and necessary for completeness. ⚠ If you switch back to
                             # raw depth (rasterize_cloud_depth: false), set this back to 2.0.
  fill_holes: true           # ON. The VTK crash (vtkPolygon.cxx:956 "start>=end") was a DEGENERATE
                             # boundary loop from welding tiles + dropping long-edge/speck tris; it is
                             # fixed by sanitizing the mesh (remove degenerate/duplicate/non-manifold/
                             # unreferenced) BEFORE fill_holes, so VTK gets simple, valid boundaries.
                             # (only adds patch triangles, leaves existing geometry exact). Guard
                             # rejects a runaway fill (>50% tris) so the real empty band stays open.
                             # Cost: filled patches have no source photo → texrecon leaves them GREY.
  fill_hole_size: 0.25       # max hole boundary size to fill (m). 0.25 closes dropouts/small gaps;
                             # keep modest so real openings (doors/windows) and the empty band stay open.
  edge_thresh: 0.05          # cull flying pixels at depth discontinuities (silhouettes).
                             # ACTIVE in DA3-dense mode (depth_source: da3) — DA3 raw depth has
                             # flying pixels and there's no cloud mask to drop them, so the 8cm→5cm
                             # gradient cutoff matters. (Bypassed only in faithful raster mode.)
  voxel_length: 0.012        # 1.2 cm — back COARSER. The 0.8cm "for detail" was a mistake: with
                             # the masked depth being patchy (discrete cloud-pixel projections), a
                             # fine voxel isolates each patch → the mesh comes out as disconnected
                             # "brushstrokes". A coarser voxel + wide truncation MERGES neighbouring
                             # patches into one continuous surface (what the working version used).
  sdf_trunc: 0.06            # 5× voxel — back to the dense-mode value (0.10 was a raster patch-merge
                             # hack). LITERATURE: 4-8× voxel is the norm; for dense depth 5× is clean.
                             # (fixed the "fragmented mesh / speck-cleanup >5%" on test4). Was 0.060.
                             # 0.060 = 5× voxel (0.012). LITERATURE (deep-research, verified): truncation
                             # of 4-8× voxel is the norm (andyzeng 5×, VoxBlox 4×, Open3D 8×); the
                             # old 3.5× was TOO LOW → fragmented surface → disconnected clusters →
                             # the cluster-cleanup then DELETED them (the missing 2m). Raising it
                             # reconciles neighbouring observations into one connected surface.
  upsample_depth: 1          # OFF — back to the clean baseline. The ×2 joint-bilateral upsample
                             # SMOOTHED the depth edges so the flying-pixel filter (edge_thresh)
                             # could no longer detect the silhouette jumps → flying pixels leaked
                             # in as the "lines in the middle". The clean TSDF that worked had no
                             # upsample. Re-enable ONLY if edges are verified clean. (1 = off.)
  smooth_method: taubin      # B — shrinkage-free λ/μ smoothing: denoises wall/floor planes
                             # WITHOUT rounding edges or eroding the mesh (unlike "simple"
                             # neighbour-averaging, which blurred detail and shrank corners).
  smooth_iterations: 5       # taubin is gentle per-iter (no shrink) → ~5 ≈ simple ×2 in
                             # denoise strength but keeps sharp features.
  decimate_target: 4000000   # decimate BEFORE texturing → ~5× less texrecon work + much smaller
                             # GLB (detail lives in the texture, Polycam-style). Was 0 (full 21M
                             # tris) which made texrecon crawl and the GLB huge. auto_tune scales
                             # this up ∝ scene diagonal, capped at max_decimate (4M).
                             # vertex_gpu texturing keeps geometry exact, so detail is not
                             # spent on a texture atlas. ⚠️ Larger GLB — set a cap (e.g.
                             # 2_500_000) if the viewer struggles.
  tsdf_block_count: 200000   # GPU hash slots PER TILE (~16GB). NOT the bottleneck: tiles run
                             # at ~20% of this. Kept moderate so the grid pre-alloc leaves
                             # VRAM for the explicit extract vertex buffer (the real limit).
  tsdf_tiling: auto          # "auto" | "off" | <int N>. Big scenes overflow a single
                             # VoxelBlockGrid (CUDA illegal memory access). "auto" splits
                             # the scene along its longest axis into enough tiles that each
                             # stays under tsdf_block_count, then crops+merges the cores.
  tsdf_tile_halo: 0.6        # m of overlap between adjacent tiles — keeps the seam surface
                             # continuous (≥ several × sdf_trunc) before the core-crop merge
  tsdf_tile_length_m: 10.0   # >0 → tile by FIXED physical length (m) along the longest axis
                             # instead of "auto" block-count. SHORT local TSDFs (~10-20m) avoid
                             # the global marching-cubes 'bridge/line' artifacts, then weld back
                             # into ONE mesh (shared global voxel grid → seams are identical).
                             # Set 0 to fall back to tsdf_tiling=auto.
  tsdf_max_edge_m: 0.10      # 0.30→0.10: drop triangles that bridge gaps/discontinuities (the main
                             # source of the lateral spill beyond the cloud). >0 → drop any triangle
                             # with an edge longer than this (m). Real
                             # TSDF surfaces have edges ≈ voxel size; this only removes the
                             # spurious near↔far 'bridge'/spike lines. Run post-weld + post-decimate.
  texture: true
  texture_mode: "texrecon"   # UV-atlas PHOTO texture (MVS-Texturing). With the SIMPLE
                             # pipeline (~46 views / ~1.6M tris on test2) this runs in
                             # minutes, so it is the default again. "vertex_gpu" remains
                             # the fast-iteration alternative (per-vertex colour ≈ 1.2cm,
                             # NOT photographic — it was left on by the old Phase-R A/B
                             # loop and produced the washed-out colours of 2026-07-09).
  texture_max_views: 400     # texrecon view cap (evenly subsampled). 400 spread over a 62m corridor
                             # thins to ~1 view/2.4 frames → patchy/untextured swaths. With auto_tune
                             # ON this scales UP ∝ scene diagonal (10m ref), capped at the ceiling below,
                             # so long scans keep view density. Higher ⇒ better coverage but slower MRF.
  texture_max_views_ceiling: 600   # hard cap on the auto-scaled view count (texrecon cost grows with it).
                                   # 600 (was 1200) ~halves the View-selection MRF — the slow stage.
  depth_source: mapanything  # omega keyframe depth ONLY (same source as the cloud) → the TSDF
                             # matches the cloud. da3_frames mixed in DA3 filler depth (a DIFFERENT
                             # source than the omega cloud) → mesh didn't coincide (1.4-1.7x extent,
                             # 22% of verts outside the cloud bbox). Revert to omega-only.
                             # --- da3_frames (old default) ---
                             # da3_frames → DA3 per-frame depth for ALL posed frames (keyframes +
                             # the inter-keyframe frames localized by dense_fusion), masked to the
                             # cloud, real poses, NO interpolation. This is what integrates the extra
                             # frames so the mesh gains inter-keyframe coverage. (was "auto" =
                             # MapAnything keyframe-only depth → ignored the extra frames.)
                             #   "auto"        → MapAnything chunk depth (294×518), else DA3, else LiDAR
                             #                   MASKED to the cleaned cloud → mesh COPIES the cloud (clean).
                             #                   ← REVERTED from "da3": dense mode dropped the cloud mask and
                             #                     reintroduced flying-pixel streaks the cloud doesn't have,
                             #                     with no resolution gain (DA3≈Map). Masked is clean.
                             #   "da3"         → DA3-DENSE FUSION (asymmetric design, NOW WIRED): integrate
                             #                   DA3's per-frame depth for EVERY blur-valid frame (the dense
                             #                   set, ~1245), not the keyframe-only MapAnything depth. Loop-
                             #                   closed keyframe poses are INTERPOLATED (SLERP+lerp) to the
                             #                   in-between dense frames; the per-frame cloud mask is replaced
                             #                   by a spatial tile crop + edge_thresh + weight≥thresh + bbox
                             #                   crop. Win is DENSITY (≫ keyframes → better multi-view
                             #                   averaging + coverage), not resolution (DA3≈Map ~500px; A
                             #                   upsample lifts that). Needs da3_run/results_output/*.npz.
                             #   "mapanything" → force MapAnything chunk depth (keyframes only)
  keep_aligned_chunks: true  # KEEP maplong_run/_tmp_results_aligned (the MapAnything dense
                             # depth+K, ~14G) after the mesh. This is the depth that MATCHES
                             # cleaned_cloud.ply — required to re-run the TSDF stage (param
                             # tuning, dense integration) WITHOUT re-running MapAnything (hours).
                             # Set false only to reclaim disk when you'll never re-mesh.


# ── Whole-scene Poisson mesh (Option B — direct from cleaned_cloud) ─────────
# Consumed by run_poisson_scene.py → segmentation/tsdf_export.export_poisson_scene,
# triggered by the UI "🟣 Poisson whole scene" button (/poisson/scene_export). Screened
# Poisson reconstructs the surface straight from the ALREADY-CLEANED cloud (57M pts) —
# denser than the 518×294 neural depth the TSDF integrates — so it captures the cloud's
# full detail and is watertight. Writes output/tsdf/scene_poisson/scene_poisson.glb, which
# appears as its own toggleable row alongside the TSDF mesh.
#
# NOTE: this MUST be its own top-level `poisson:` mapping. Without the header below these
# keys folded into `tsdf:` above, where `decimate_target: 1500000` SILENTLY clobbered the
# tsdf `decimate_target: 0` (so the TSDF mesh was decimated despite "keep FULL resolution"),
# and the Poisson worker — which reads config['poisson'] — saw nothing and used code defaults.
poisson:
  max_points: 2000000        # cheap uniform pre-downsample cap before any hash-based op or
                             # Poisson. KEEP ≤~2M: orient_normals_consistent_tangent_plane builds
                             # a global MST over every point and gets very slow / looks hung above
                             # ~2-3M (the "Poisson stuck at starting" symptom). 0 = no cap.
  voxel_downsample: 0.008    # m — voxel-downsample the cloud before Poisson (even surface density
                             # → cleaner normals/reconstruction AND fewer points for the MST). 0 = off.
  poisson_depth: 11          # octree depth (resolution). 10≈coarse, 11≈fine, 12≈very fine
                             # (slower, more RAM). 11 is the room-scale sweet spot.
  density_quantile: 0.03     # trim the lowest-density 3% of Poisson vertices (the balloon
                             # of extrapolated surface beyond the real samples). 0 = keep all.
  decimate_target: 1500000   # target tri count before texturing (0 = off)
  texture: true              # UV-atlas (texrecon) photo texture, same path as the TSDF scene
  use_refined_poses: true    # DA3 loop-closure poses for texturing (raw ARKit drifts)


# ── 3D Reconstruction ──────────────────────────────────────────────
# Backends supported by workers/map_worker.py:
#   "da3"               → DA3 Streaming (neural, no LiDAR)
#   "lidar"             → Pure LiDAR backprojection (Stray Scanner only)
#   "hybrid"            → DA3 calibrated with LiDAR depth (estimate-then-inject poses)
#   "hybrid_cond"       → Stray → DA3 (ARKit poses via cam_enc + LiDAR-calibrated depth)
#                         → MapAnything with FULL prior (depth + K + poses) → loop closure
#   "mapanything"       → VGGT-Long (legacy fallback)
#   "gaus_slam"         → Gaussian Surfel SLAM via DA3
#   "gaus_slam_lidar"   → GauS-SLAM with LiDAR+ARKit
#   "gaus_slam_da3"     → GauS-SLAM with DA3 depth+poses
#   "gaus_slam_hybrid"  → GauS-SLAM with LiDAR-calibrated DA3 + ARKit
#   "nerfstudio"        → neus-facto SDF mesh via nerfstudio
reconstruction:
  backend: "vggtomega"                  # "da3" | "mapanything" (VGGT-Long) | "lidar" | "hybrid" | "vggtomega"
                                        # vggtomega = SOTA pose backbone (CVPR 2026), dynamic-scene robust:
                                        # DA3 metric depth (anchor) → Omega up-to-scale poses → scale_align
                                        # (metric) → BA. da3 = DENSE backbone: cm-level chunk alignment +
                                        # loops + metric depth; BA corrects its smooth drift.
  device: "cuda"                        # "cpu" | "cuda" — keep "cpu" while RTX3060 is broken

  # ── VGGT-Omega backbone (backend: "vggtomega") ──
  # SOTA camera/pose (CVPR 2026, +77% on Sintel) and robust to DYNAMIC scenes (moving
  # people/machinery) → our worksite default. Pipeline in this mode:
  #   DA3 per-frame METRIC depth (no streaming) → VGGT-Long[Omega] up-to-scale poses →
  #   scale_align (s = median DA3/Omega depth) → metric poses → cloud/TSDF (unchanged).
  # No ICP dense-fusion (poses are SOTA; ICP was the texture-mismap stopgap).
  # ⚠ Weights are gated: request access at huggingface.co/facebook/VGGT-Omega, download
  #   vggt_omega_1b_512.pt → vendor/vggt-omega-weights/ (path in stac_vggtomega.yaml).
  vggtomega:
    chunk_size: 500                     # windowed FALLBACK only (video > max_frames_single_pass):
    chunk_overlap: 250                  # 500/250 = few seams, wide-baseline chunks, 50% overlap
                                        # (~43 GB VRAM at 500 frames — needs the GPU to itself)
    loop_closure: true
    resolution: 512                     # load_and_preprocess_images(image_resolution=…)
    mode: "balanced"                    # "balanced" (≈res² tokens) | "max_size" (less VRAM)
    scale_align: true                   # metric: DA3 anchor + scale_align (global similarity:
                                        # scales cloud + poses by s = median DA3/Omega depth).
                                        # false → up-to-scale (raw Omega isolation test).
    scale_near_frac: 0.25               # scale_align: ratio over the closest frac of pixels
                                        # (near band — DA3 compresses the far range; 0.25
                                        # validated on test3, +8.25% vs all-pixels)
    scale_conf_top_frac: 0.10           # scale_align: AND only the top-10% DA3-confidence
                                        # pixels vote (npz 'conf'); 0 disables the gate.
                                        # Fallback ladder if a filter starves: near∩conf →
                                        # conf → near → all valid.
    scale_drift: true                   # per-chunk LINEAR scale drift — KEEP ON. A3
                                        # 2026-07-11 tested false on test4: serpenteado
                                        # unchanged and duplicates got MUCH worse (spread
                                        # ×1.63→×1.72, held-out anchor gain lost). The drift
                                        # is earning its keep against overlap duplication.
                                        # Original doc:
                                        # metric-lock: per-chunk LINEAR scale drift (log-scale,
                                        # 2 DOF/chunk) from positioned DA3 anchors + per-frame
                                        # seam ratios, SELF-GATED on held-out seam observations
                                        # (applies only when it beats the constant model ≥25%
                                        # on data it never saw). test4 2026-07-10: 48% anchor
                                        # spread inside chunk 3, adjacent scale jumps 18-29% —
                                        # the leftover warp was the chimney/cones z-drift.
    # suspect_spread: 0.30              # soft health tier: anchor IQR/median beyond this ⇒
                                        # SUSPECT — the chunk keeps writing points but argues
                                        # more quietly (elastic consensus biased toward the
                                        # trusted side; finereg down-weights its planes 0.5).
    elastic_seam: true                  # per-frame seam consensus (run-6 behaviour). A2
                                        # 2026-07-11 tested false on test4: NO visible change
                                        # in serpenteado or duplicates — acquitted as the
                                        # visible-warp culprit despite its unsmoothed
                                        # per-frame fits (|t| up to 159 cm at seam 7->8).
    hybrid_da3: true                    # Phase E-lite 2026-07-11 (BEST OF BOTH WORLDS): each
                                        # keyframe adopts DA3's per-pixel depth SHAPE at
                                        # omega's scale and pose, right after metric-lock —
                                        # Phase A proved the serpenteado is intrinsic to
                                        # omega's feed-forward output, and DA3's isolated
                                        # depth is locally straight. Per-frame median ratio
                                        # pins DA3 to omega's scale (kills DA3's absolute
                                        # metric jitter); shape corrections beyond 35% or
                                        # farther than hybrid_da3_far_m keep omega. Extracts
                                        # isolated DA3 for ALL keyframes (denser scale
                                        # anchors too — metric-lock numbers WILL shift).
    hybrid_da3_far_m: 15.0              # beyond this omega depth the pixel keeps omega
                                        # (isolated DA3 degrades at range — user-observed;
                                        # onion risk is at distance, straightness is near).
    ownership_backfill: true            # Phase D: in overlap zones the non-owner copy writes
                                        # EXACTLY the pixels the owner drops (frozen write
                                        # thresholds → owner-writes and backfill are disjoint
                                        # complements; a pixel never enters the cloud twice).
                                        # Recovers the hole-filling the pre-ownership 2x
                                        # redundancy used to provide, without the duplicates.
    elastic_smooth_win: 5               # Phase B: moving-average window (frames) over the
                                        # per-frame seam fits — adjacent shared frames stop
                                        # receiving uncorrelated rigid moves. 1 = raw fits.
    elastic_max_t_m: 0.30               # Phase B: per-fit translation cap (m). A fit beyond
                                        # this is scaled down as a whole twist — bounded
                                        # authority, not faked closure (seam 7->8 fitted up
                                        # to 1.59 m to close an 8 cm gap). 0/null = no cap.
    intra_chunk: true                   # KEEP ON — A4 2026-07-11 tested false on test4:
                                        # serpenteado unchanged (it is intrinsic to omega's
                                        # feed-forward output, not our stages) and duplicates
                                        # slightly worse without it.
                                        # Original doc: INTRA-CHUNK per-frame consensus, ITERATIVE (set
                                        # false → run 3 exactly). Corrects the warp BETWEEN
                                        # frames of the same chunk. Two measured lessons baked
                                        # in: endpoints clamped to the seam consensus (no
                                        # correction longer than one chunk — the failed global
                                        # pose graph), and BLOCK RELAXATION until convergence
                                        # (run 6: one-shot per-chunk gating left neighbours
                                        # diverged 24 cm — correcting a chunk CREATES the need
                                        # for its neighbours' corrections, so every round
                                        # re-measures each chunk against its neighbours'
                                        # current state, cross-chunk pairs included, applies
                                        # under-relaxed increments and repeats until they
                                        # vanish). Final self-gate on pre-correction held-out
                                        # (within + cross strata; no seam may degrade); fail →
                                        # the whole stage is identity.

  # ── SIMPLE pipeline (one concept — validated 2026-07-09 vs the VGGT-Omega web demo) ──
  # Sparse frames (~1 fps) → ONE VGGT-Omega pass (no windows → no seams → no onion) →
  # aggressive confidence filter → metric scale from a handful of DA3 anchor frames
  # (or Stray depth when the session provides it) → upright orientation baked from the
  # camera poses (mean camera-down = gravity; no floor RANSAC in the critical path).
  # Windows return ONLY when the sampled video still exceeds max_frames_single_pass.
  simple:
    enabled: true
    frame_selection: motion             # "motion" (default) = parallax-uniform keyframes: one
                                        # keyframe per keyframe_motion_quantum of accumulated
                                        # inter-frame pixel motion, sharpest frame per window.
                                        # Standing still adds ~no keyframes (dense low-baseline
                                        # input amplifies feed-forward drift — FastVGGT / the
                                        # VGGT-Long README's own drift note); fast stretches
                                        # get more (no 9 m jumps). "fps" = plain time sampling.
    keyframe_motion_quantum: 250.0      # motion units (mean gray-diff @320px) per keyframe.
                                        # Measured: ≈734 units/m close-range, ≈160 units/m in
                                        # a big hall → ~0.3-1.5 m baseline depending on scene
                                        # depth — parallax is what the estimator feels, meters
                                        # are not. Lower = denser keyframes.
    target_fps: 1.0                     # "fps" mode only: time sampling rate. 1 fps = the web
                                        # demo's regime (its slider caps at 2; examples use 1).
    max_walk_single_pass_m: 15.0        # Omega's COMFORT RANGE (config parameter, tune freely):
                                        # phase 1 always runs one pass; if the measured walk
                                        # exceeds this, phase 2 re-runs chunked-metric (Omega
                                        # drifts ~1.3 cm/m past its comfort range — measured).
                                        # 25→15 (2026-07-09): test6 (29 m walk) was still bad
                                        # single-pass — the comfort proven so far is test2 ~10 m.
    chunk_walk_m: 12.0                  # chunked-metric: walked meters per chunk (50% overlap).
                                        # Small chunks = the regime where Omega is excellent.
    chunk_anchors: 3                    # DA3 metric anchors per chunk (metric lock BEFORE the
                                        # SE(3) gluing — scale is never a degree of freedom).
    # densify: REMOVED (2026-07-10). DA3 fill glued by frame-to-keyframe ICP was
    # measured on test4: 863/1235 frames rejected (fitness<0.3) and the surviving
    # 30.4M points (46.7% of the cloud) sat OFFSET -26.6 cm median (max 83 cm) from
    # the Omega skeleton — DA3's monocular shape vs Omega's multi-view shape = a
    # manufactured onion. If density is ever needed, densify WITHIN the Omega
    # chunks (more keyframes per chunk in its comfort regime), never by gluing
    # another model's geometry.
    max_frames_single_pass: 600         # above this, windowed mode resumes (long videos).
                                        # ~43 GB VRAM at 500 frames (paper) ≈ 86 MB/frame —
                                        # the worker ALSO checks free VRAM and degrades to
                                        # windowed mode with a fitting chunk when short.
    exclusive_gpu: true                 # stop vLLM before reconstruction (Omega gets the
                                        # whole GPU); the VLM stage auto-restarts it after
    conf_percentile: 10.0               # THE confidence filter, web-demo semantics: drop the
                                        # bottom 10% of valid (non-sky) points by confidence.
                                        # Phase D 2026-07-11: 20 → 10 — with one writer per
                                        # frame the old 2x overlap redundancy no longer
                                        # backfills what this cut removes, and 20% was a
                                        # measured hole source. Scene-independent by
                                        # construction (the old mean-relative coef was not:
                                        # mean*0.6 kept 53% of one scan and 89% of another).
                                        # Set to null to fall back to conf_threshold_coef.
    conf_threshold_coef: 0.6            # legacy fallback (keep conf >= mean*coef); ignored
                                        # whenever conf_percentile is set
    scale_anchor_frames: 12             # DA3 runs on ONLY this many evenly-spread frames
    orient_from_poses: true             # bake Y-up + floor at y=0 into cloud + poses

  # ── Dense frame fusion (frame-to-keyframe ICP) — cloud-stage completeness ──
  # VGGT-Long poses+cloud use KEYFRAMES only → inter-keyframe holes the TSDF inherits.
  # The extra frames are LOW-PARALLAX (that's why they weren't keyframes) → multi-view
  # (VGGT) on them degrades ("onion"). Instead this LOCALIZES each extra frame by colored
  # ICP against the nearest keyframe's depth cloud (init at the keyframe pose → anchored,
  # no drift, no triangulation), then back-projects its DA3 depth → extra cloud coverage
  # CloudCompPy merges → MORE COMPLETE cloud → TSDF inherits it. Keyframes/VGGT-Long are
  # NOT touched. Confidence filtering is IDENTICAL to the backend's. Runs in the recon env.
  # ── Global pose refinement (bundle adjustment) — runs after the backend, before CloudCompPy ──
  # VGGSfM learned correspondences (robust to low texture) → COLMAP/Ceres POSE-PRIOR bundle
  # adjustment (anchored to the backbone's metric poses → fixes gauge, stays metric, refines
  # relative drift) → refined camera_poses.txt. The TSDF then integrates depth at the refined
  # poses. Applies to ALL chunked backbones — da3, mapanything AND vggtomega (for omega
  # the order is Omega → scale_align → BA, so the BA refines already-metric poses).
  fine_register:                        # surface_fit stage 0 — INDEPENDENT of the BA (which stays
    enabled: true                       # off): plane-constrained point-to-plane alignment between
                                        # chunk PLYs, run before CloudComPy merges them. Collapses
                                        # the residual mm→cm inter-chunk bias that becomes TSDF
                                        # double layers; the affected frame poses get the same rigid
                                        # correction (backup camera_poses.txt.prefinereg). Best-effort.
    # accept_sep_m: 0.024               # acceptance: residual plane separation; default 2×tsdf.voxel_length
    max_correction_m: 0.25              # PER-ROUND cap: single-step corrections beyond this are
                                        # refused (a shift that big in one step is a pose problem —
                                        # fix upstream, don't fake alignment). Raised
                                        # 0.12→0.25 on evidence: test2 2026-07-09 refused 9 REAL
                                        # intra-chunk drift corrections of 125–230mm (chunks 5–9),
                                        # leaving that drift in the cloud/mesh.
    anneal_rounds: 3                    # Phase C 2026-07-11: bounded solve→apply→re-measure rounds.
                                        # test4 measured REAL chunk offsets of 300–1100mm that one
                                        # capped solve can only refuse (31 units REFUSED, worst plane
                                        # separation stuck at ~117mm); rounds let real offsets
                                        # accumulate in honest 250mm steps. 1 = old single-shot.
    max_total_correction_m: 0.75        # per-unit accumulated budget across rounds; plus FULL
                                        # ROLLBACK to identity when no round improves the worst
                                        # plane separation (a correction that doesn't pay for
                                        # itself is a warp, not a fix).
                                        # 0.12 (was 0.08): test3 measured 65 mm of REAL VGGT drift
                                        # between chunks — the old cap left no headroom.
    # pieces_per_chunk: 5               # rigid pieces per chunk for the JOINT pose-graph solve.
                                        # Long hostile captures drift INSIDE a chunk (test2: rigid
                                        # per-chunk left pairs at 10 cm); pieces + per-frame
                                        # interpolation absorb it. 1 = old rigid-chunk behavior.
                                        # 3→5 (2026-07-10): test4's warp was not 3-piece-rigid.
    # ground_datum: true                # tie every unit's ground patch to ONE shared session
                                        # ground plane inside the joint solve — the vertical datum
                                        # that stops per-chunk vertical drift accumulating along
                                        # the chain (test4: chimney 16 cm apart in y across chunks).
    # capture_m: 0.25                   # plane-match capture radius for the solve's first half:
                                        # wide enough to SEE drifted pairs (incl. non-adjacent
                                        # overlaps = geometric loop closures); acceptance is always
                                        # measured at the strict 0.12 radius.
    # iters: 20                         # joint Gauss-Newton iterations (annealed robust scale:
                                        # early iterations pull on the real drift, late ones
                                        # tighten to mm — a fixed 2 cm Huber treated test4's 10 cm
                                        # drift as an outlier and left it in place).
  bundle_adjust:
    enabled: false                      # OFF — the global BA DEGRADED the result on the metric
                                        # vggtomega recon (A/B vs baseline_noBA was worse). Omega
                                        # poses + global scale_align are kept as-is. Do NOT re-enable
                                        # for vggtomega without re-validating against the no-BA baseline.
    python: "/workspace/miniforge3/envs/mapanything/bin/python"
    track_window: 32                    # keyframes per VGGSfM tracking window (was 24: longer windows
                                        # → longer tracks, fewer windows needed)
    track_stride: 24                    # was 12. Window count ≈ (n_kf-win)/stride drives wall-clock
                                        # (per-window cost ~constant). 24 = 25% overlap (was 50%) →
                                        # ~half the windows, BA still coupled across adjacent windows.
    track_grid: 24                      # query-point grid density per query frame (24×24=576 pts/kf;
                                        # grid=48 over-produced 1.4M tracks/2.2h — BA only needs enough
                                        # landmarks to anchor poses + localize fillers; 24 ≈ 350K/~35min)
    prior_stddev_m: 2.0                 # LOOSE anchor (was 0.10): the backbone trajectory has a
                                        # per-window scale gradient (chunk jumps); a tight prior
                                        # pinned the BA to it. 2.0m lets the VGGSfM tracks reconcile
                                        # the trajectory while the prior ensemble still anchors metric
                                        # scale. THE key knob under test — watch the trajectory logs.

  dense_fusion:
    enabled: false                      # OFF — superseded by the global pose-prior BA (run_colmap_ba).
                                        # The inter-keyframe ICP was a stopgap that also caused the
                                        # texture mis-mapping; pose refinement now comes from the BA,
                                        # not from anchoring filler frames. (true → run after backend.)
    dedup_cosine: 0.99                  # keep a non-keyframe only if its DINO cosine to the last-kept
                                        # fusion frame is < this → drops "filmed the same spot for
                                        # minutes" redundancy ("not all frames, just new coverage").
    min_fitness: 0.3                    # reject an ICP registration whose overlap (fitness) is below
                                        # this → a frame that can't be reliably localized is skipped.
    # python: /workspace/miniforge3/envs/mapanything/bin/python   # override the env if needed
  frames_selector: "dino"              # SINGLE source of frame-set mode (writes selected_frames.json):
                                       #   "parallax" = DEFAULT: GEOMETRIC triangulation-angle keyframes
                                       #                (baseline) for the SLAM backbone (VGGT-Long). Needs
                                       #                DA3 depth+pose (runs DA3 on all blur-valid frames
                                       #                first). Aborts on pure rotation. Cosine stays for DA3.
                                       #   "dino"     = blur + DINO-cosine keyframes (appearance, legacy)
                                       #   "stride"   = uniform 1-of-N subsample (mapanything.frame_stride)
                                       #   "none"     = all frames (no decimation)
                                       # LITERATURE (2026 deep-research): do NOT feed all dense handheld-
                                       # video frames to the transformer multi-view stage. Cost scales
                                       # steeply (VGGT 21GB@100fr, OOM>300fr) and redundant low-baseline
                                       # frames AMPLIFY drift (FastVGGT: redundancy-cut → ATE 0.196→0.164;
                                       # Chamfer worsens 0.416@300fr→0.471@1000fr). Content/overlap keyframing
                                       # (DINO-cosine) is the recommended family (≈ DROID-SLAM flow / MapAnything
                                       # 25% covisibility). "stride" is motion-blind → inferior. Threshold in
                                       # frame_selection.dino_threshold (0.975 = conservative, coverage-preserving).
  blur_filter: true                    # true = drop blurry frames (Laplacian, via frame_quality.json)
                                       # before selection; false = keep ALL frames (no blur cull).
                                       # LITERATURE: motion blur corrupts SfM poses (COLMAP ATE 0.128 vs 0.050
                                       # sharp) AND violates the sharp-image assumption — dropping blurry frames
                                       # is standard NeRF/3DGS/MVS preprocessing. Toggleable; applies to all modes.

  # DA3 Streaming (Depth Anything 3)
  da3:
    conda_env: "da3"
    model_id: "depth-anything/DA3NESTED-GIANT-LARGE-1.1"
    remove_sky: true                   # standalone da3 backend: drop sky pixels via DA3's
                                       # own sky head. Ignored in MapAnything-priors mode
                                       # (map removes sky with skyseg). true = always on.
    chunk_size: 120
    overlap: 60
    loop_enable: true                  # SALAD loop closure
    infer_gs: false                    # 3D Gaussian Splatting (cosmetic) — off: 5.7GB merge hit OSError EIO; re-enable on the GPU box
    align_method: "sim3"               # "sim3" | "se3" | "scale+se3"
    align_lib: "torch"                 # "numpy" (CPU) | "triton"/"torch" (GPU)
    depth_threshold: 20.0              # max depth (m)
    conf_threshold_coef: 0.75          # VGGT-Long's OWN cloud-point filter (its base_config.yaml
                                       # default = 0.75): keep conf >= 0.75×mean. Native to the vendor
                                       # (loop_utils/sim3utils.save_confident_pointcloud), NOT a STAC
                                       # invention — leave it.
    sample_ratio: 1.0
    save_depth_conf_result: true       # save per-frame depth+conf .npz

  # LiDAR / Stray Scanner / Hybrid
  lidar:
    trust_range: 5.0                   # max LiDAR depth (m) — iPad LiDAR ≈ 5m
    confidence_threshold: 1            # 0=low, 1=medium, 2=high
    fallback_to_da3: true              # use DA3 if no Stray data found
    stride: 4                          # frame stride for Stray depth extraction

  # MapAnything (VGGT-Long) — legacy
  mapanything:
    conda_env: "mapanything"
    model_weights: "facebook/map-anything-apache"
    chunk_size: 120
    chunk_overlap: 60
    frame_stride: 1                     # ALL frames (was 2). frames_selector:"none" already
                                        # forces all frames; kept at 1 for consistency.
    loop_closure: true
    conf_threshold_coef: 0.75          # chunk PLY filter: drop points with conf < 0.75×mean.
                                        # VGGT-Long's proven default; cuts the noisy low-conf
                                        # tail (0.0 = keep all = pass all noise).
    sample_ratio: 1.0
    use_da3_priors: true               # multi-modal: run DA3 first, feed its metric
                                        # depth + intrinsics into MapAnything (poses still
                                        # estimated by MapAnything). "map fed by DA3 depth".
    da3_prior_conf_percentile: 40      # DA3 recommended default (conf_thresh_percentile=40):
                                        # drop the bottom 40% least-confident DA3 prior pixels
                                        # per frame before feeding MapAnything (was 0 = raw/noisy).
    map_conf_percentile: 10            # MapAnything's confidence_percentile — drop the bottom N%
                                        # by model confidence during inference. CORRECTED 40→10:
                                        # 10 is MapAnything's ACTUAL default (base_model.py:413
                                        # `.get('map_conf_percentile', 10)`). The old 40 conflated
                                        # this with DA3's conf_thresh_percentile=40 (a different
                                        # param) → it was 4× too aggressive (less complete). 0 = off.
    da3_prior_use_poses: false         # "full prior": also feed DA3's per-frame poses
                                        # (camera_poses) to MapAnything, not just depth+K.
                                        # Forced ON by backend "hybrid_cond". Only meaningful
                                        # when the DA3 priors carry real ARKit-conditioned
                                        # poses (Stray + StrayDA3CondStreaming).

  # GauS-SLAM (Gaussian Surfel SLAM)
  # Pipeline: DA3 depth+poses → TUM bridge → GauS-SLAM (2DGS surfels).
  # Skips frame_selector (uses all non-blurry frames) and CloudCompPy
  # (Gaussian surfels are clean by nature).
  gaus_slam:
    conda_env: "gaus_slam"
    da3_model_id: "depth-anything/DA3NESTED-GIANT-LARGE-1.1"
    process_res: 504                   # DA3 processing resolution
    use_ray_pose: false                # ray-based pose (slower, more accurate)
    max_frames: 0                      # 0 = all (use 50 for quick test)
    frame_step: 2                      # 1-of-N temporal subsample (60fps→30fps if N=2)
    num_tracking_iters: 120            # tracking optimization iters
    num_ba_iters: 120                  # bundle adjustment iters
    max_submap_frames: 40
    eval_mesh: false                   # mesh generated separately after CloudCompPy
    save_renders: true                 # for debug/SAM3

  # GauS-SLAM Hybrid extras
  gaus_slam_hybrid:
    lidar_trust_range: 5.0
    calib_min_depth: 0.3               # min depth for calibration
    da3_max_range: 20.0                # clip max DA3 calibrated depth


# ── Post-Processing (CloudCompPy) ──────────────────────────────────
postprocessing:
  enabled: true
  conda_env: "CloudComPy310"

  # ── Scene-level consolidation (surface_fit stage 1 at scene scale) ──
  # After CloudComPy writes cleaned_cloud.ply, a normal-aware robust MLS
  # collapses residual onion layers IN PLACE (point count/order preserved →
  # colors + segmentation globalIndices stay valid). The raw measurement is
  # kept as cleaned_cloud_raw.ply — surface_fit residuals ALWAYS use it.
  # Oriented normals (toward nearest camera) keep the two REAL faces of thin
  # walls/panels apart — only same-orientation ghost layers collapse.
  scene_consolidate:
    enabled: true
    radius_m: null              # null = adaptive: 2× worst fine_register residual
    min_radius_m: 0.02          # clamp for the adaptive radius…
    max_radius_m: 0.06          # …(also the fallback when no fine_register report)
    iterations: 2
    normal_gate: 0.25           # neighbours with oriented-normal agreement below
                                # this are excluded (opposite faces never merge)

  # Pipeline toggles
  skip_duplicates: true
  skip_sor: false
  skip_noise: true                     # noise filter is O(n²), hangs on >1M points
  skip_normals: true                   # not needed for the point cloud viewer

  # Confidence gate — denoise cleaned_cloud AT SOURCE (so the TSDF needs no extra filter).
  # Min-max normalised, SAME as the viewer slider: keep points with (conf-min)/(max-min) >=
  # this. 0.1 ≈ the UI slider at 0.1 (≈ raw conf ≥ 22, ~17% kept) → drops the noisy low/mid-
  # confidence vertical smear. 0 = off. Applied BEFORE voxel/SOR (also speeds them up).
  # ⚠️ EMPIRICAL-TUNE AFTER the blur+DINO reconstruction: the literature (deep-research 2026)
  # says aggressive confidence filtering is a SYMPTOM of noisy input — outliers concentrate in
  # low-baseline / occluded / blurred regions, which blur-drop + keyframing remove at source. So
  # with cleaner frames the conf tail should be smaller and this gate can likely RELAX without
  # re-admitting noise. No measured curve exists → A/B it on the new cloud, don't lower it blind.
  # 0 = OFF. The min-max normalization is FRAGILE when the merged cloud mixes confidence
  # SCALES (dense_fusion DA3 conf 0..13.8 vs MapAnything ~1.5..19): the bulk piles up near the
  # min, so even 0.01 dropped 92% of points (134M→11M) → the cloud collapsed to 111 frames and
  # the TSDF came out sparse. The backend ALREADY filters confidence per-source (DA3 p40 +
  # MapAnything p10 + 0.75×mean on the chunk PLYs), so this CloudCompy gate is a redundant THIRD
  # filter — leave it OFF. (Was 0.01; re-enable only if you fix the cross-source conf scaling.)
  conf_min_norm: 0

  # Statistical Outlier Removal
  sor_knn: 8                           # neighbors (lower = keeps isolated objects)
  sor_sigma: 3.0                       # std multiplier (higher = keeps more points)

  # Noise filter (only safe on small clouds <500K)
  noise_radius: 0.02
  noise_sigma: 2.0

  # Voxel subsampling
  voxel_size: 0.005                    # 1mm voxel (keeps cloud under 100M pts)
  max_points: 0                        # 0 = unlimited


# ── Coverage Engine (Tier 1) ───────────────────────────────────────
coverage_engine:
  enabled: false
  ray_radius: 0.05                     # cylinder radius (m) for occlusion ray
  sample_density: 4.0                  # BIM samples per m²
  completion_threshold: 80.0           # % coverage → COMPLETED
  quality_threshold: 80.0              # % within tolerance → COMPLETED

# ── Surface Fit (measurement-backed smooth surfaces; replaces ShapeR for architectural classes) ──
# Fits the lowest-DOF smooth model that explains each SAM3 segment (plane →
# quadric → swept profile → B-spline) and keeps the point→surface residuals as
# the fidelity deliverable (stats + heatmap + findings). The geometry is never
# smoothed: the model is fitted and the deviations are preserved as measurement.
# Keys mirror reconstruction.surface_fit.runner.fit_segment kwargs (introspected —
# see build_surface_fit_kwargs; unknown keys are ignored).
surface_fit:
  models: [plane, cylinder, sphere, swept_profile, bspline]  # escalation ladder, lowest DOF first;
                              # remove entries to forbid a model (e.g. [plane] forces plane-only)
  consolidate_method: auto    # stage-1 layer collapse before fitting: auto (WLOP, MLS if CGAL env
                              # missing) | wlop | mls | none. Residual reports ALWAYS use the
                              # original cloud — consolidation only feeds the fitter.
  consolidate_radius_m: 0.06  # WLOP/MLS neighborhood radius; must exceed the layer separation
                              # (double layers thicker than this won't collapse — fix registration)
  wlop_select_percentage: 25.0 # WLOP also downsamples: output = this % of input points
  wlop_iterations: 30
  plane_dist_thresh: 0.012    # RANSAC inlier distance (m) — matches the repo-wide 1.2 cm default
  ransac_iters: 500
  min_inlier_frac: 0.30       # below this the segment has no dominant surface → no fit
  max_fit_points: 400000      # fits subsample down to this (deterministic); residuals ALWAYS use
                              # every original point — fidelity is never subsampled
  grid_cell_m: 0.05           # UV cell for residual gridding (heatmap px, Moran's I, findings).
                              # Cell means average sensor noise → the grid exposes registration/
                              # shape structure. 5 cm ≈ good balance for rooms and tunnel sections.
  morans_z_max: 4.0           # escalate when ALL: z-score > this (statistically structured)…
  morans_i_min: 0.05          # …AND Moran's I > this (not just a huge-N artifact)…
  structure_min_mm: 1.5       # …AND the structure's amplitude exceeds this. Sub-mm systematic
                              # wiggles are real but irrelevant vs construction tolerances —
                              # don't trade a 5-DOF cylinder for a 400-DOF spline over them.
  flatness_tol_mm: 5.0        # construction spec: max deviation under the straightedge window…
  flatness_span_m: 2.0        # …of this size (default "5 mm under 2 m")
  finding_dev_mm: 5.0         # |cell mean| above this → candidate finding zone (panza/depresión)
  finding_min_area_m2: 0.05   # ignore smaller zones (sensor speckle, isolated clutter)
  tilt_mm_per_m: 3.0          # residual gradient above this on a wall → 'tilt' finding (desplome)
  support_radius_m: 0.08      # NO-EXTRAPOLATION radius: mesh exists only where measured points
                              # lie within this distance (holes in data stay holes in the model)
  mesh_resolution_m: 0.05     # output mesh quad size (m); small enough for mvs-texturing UVs
  heatmap_vmax_mm: null       # symmetric color range of heatmap/deviation PLY; null = auto (p98,
                              # floor 2 mm so near-perfect surfaces don't dramatize noise)
  ctrl_point_spacing_m: 0.5   # B-spline control-point spacing — the geometric low-pass: follows
                              # real curvature, physically cannot follow high-frequency noise
  section_spacing_m: 0.20     # swept-profile cross-section spacing along the axis (vaults/tunnels)
  # ── scene-level (stages 3 + 5) ──
  fitted_roles: [wall, floor, ceiling, slab, vault, tunnel, column, beam, deck, platform, ramp]
                              # SAM3 labels (substring match) that get fitted surfaces; every other
                              # class keeps the existing TSDF crop path unchanged (hybrid scene)
  regularize: true            # stage 3: GlobFit-style plane snapping + clean edges
  regularize_angle_tol_deg: 1.0 # snap parallel/orthogonal/vertical within this angle ONLY — a
                              # larger real deviation is a construction finding, never forced
  coplanar_tol_mm: 10.0       # same-direction planes within this offset merge to one plane
  snap_edge_dist_m: 0.10      # boundary vertices within this of an adjacent plane slide onto the
                              # exact intersection line (clean wall/floor edges, no extrapolation)

# ── MeshFlow (generative per-object meshes; replaces ShapeR) ──────────
# ⚠ NON-METRIC: MeshFlow outputs are GENERATIVE visual assets (furniture,
# equipment, signage) — never metric deliverables. The metric surfaces come
# from surface_fit; scene geometry stays TSDF. Outputs are named
# <folder>_visual.glb and carry "metric": false in meta.json.
# Routing: architectural classes (surface_fit.fitted_roles) never reach
# MeshFlow; oversized segments stay on the TSDF path.
meshflow:
  steps: 28                   # flow-matching denoise steps (vendor default)
  guidance_scale: 2.5         # CFG — only effective when a reference image is provided
  seed: 42
  dtype: fp16
  num_verts: null             # vertex-budget control (needs use_proj_cond_on_temb in the
                              # model config; null = model default ~4096)
  max_extent_m: 15.0          # segments larger than this skip MeshFlow (the model's ~4096-vertex
                              # budget degrades on scene-scale geometry) — raised per user decision
  exclude_architectural: false # false (user decision 2026-07-03): generate for ANY class — the
                              # assets are non-metric regardless and are never compared against
                              # BIM; surface_fit remains the only metric surface source
  require_ref_image: true     # MANDATORY image conditioning (project decision — upstream
                              # says optional, but geometry-only generations came out wrong
                              # on real scan segments). The exporter picks the best view by
                              # mask pixel count (seg_masks.npz traceability), crops it to
                              # the object bbox and saves <folder>_ref.jpg; instances with
                              # no usable view are SKIPPED, never generated blind.
                              # Needs the DINOv3 checkpoint (weights/dinov3 — installed).
