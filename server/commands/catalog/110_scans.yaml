# The 'scans' commands of STAC (server/commands — the database of commands is built from
# these declarations). One entry per command; texts in es / en / fr.
area: scans
position: 110
title:
  es: Escaneos
  en: Scans
  fr: Scans
summary:
  es: 'Los escaneos de una sesión: abrir otro, listarlos, fusionarlos.'
  en: 'The scans of a session: open another, list, fuse.'
  fr: 'Les scans d''une session : en ouvrir un autre, les lister, les fusionner.'
commands:
- id: scans.open
  kind: action
  runs_on: ui
  model: Open another scan of the open session, by its date or label (INTERFACE STATE lists the scans).
  args:
    scan:
      type: string
      description: the scan's date (YYYY-MM-DD) or label
      required: true
  needs:
  - session
  text:
    es:
      title: Abrir un escaneo
      say:
      - abrí el escaneo del 31 de agosto
      - cambiá al escaneo 2408
      - abrí el otro escaneo
      done: Abriendo el escaneo {detail}.
    en:
      title: Open a scan
      say:
      - open the scan of August 31
      - switch to scan 2408
      - open the other scan
      done: Opening scan {detail}.
    fr:
      title: Ouvrir un scan
      say:
      - ouvre le scan du 31 août
      - passe au scan 2408
      - ouvre l'autre scan
      done: Ouverture du scan {detail}.
- id: scans.list
  kind: query
  runs_on: ui
  model: Which scans the open session has.
  needs:
  - session
  text:
    es:
      title: Listar los escaneos
      say:
      - qué escaneos tiene la sesión
      - listame los escaneos
      - cuántos escaneos hay
      done: 'Escaneos: {detail}.'
    en:
      title: List the scans
      say:
      - which scans does the session have
      - list the scans
      done: 'Scans: {detail}.'
    fr:
      title: Lister les scans
      say:
      - quels scans a la session
      - liste les scans
      done: 'Scans : {detail}.'
- id: scans.open_fuse
  kind: action
  runs_on: ui
  model: 'Open the window to fuse (merge) the scans of the open session. It only opens the window: the fusion is
    launched by hand.'
  needs:
  - session
  text:
    es:
      title: Abrir la fusión de escaneos
      say:
      - abrí la fusión
      - quiero fusionar los escaneos
      - fusionar escaneos
      done: Ventana de fusión abierta.
    en:
      title: Open the fusion of scans
      say:
      - open the fusion
      - I want to fuse the scans
      - fuse scans
      done: Fuse window open.
    fr:
      title: Ouvrir la fusion des scans
      say:
      - ouvre la fusion
      - je veux fusionner les scans
      - fusionner les scans
      done: Fenêtre de fusion ouverte.
- id: scans.close_tab
  kind: action
  runs_on: ui
  model: 'Close the tab of an open scan (nothing is lost: the list reopens it). Closing the active tab shows the
    neighbouring one.'
  args:
    scan:
      type: string
      description: the scan's date (YYYY-MM-DD) or label; omit for the active tab
  needs:
  - session
  - scan
  text:
    es:
      title: Cerrar la pestaña de un escaneo
      say:
      - cerrá esa pestaña
      - sacá la pestaña activa
      - cerrá la pestaña de la toma anterior
      done: Pestaña cerrada.
    en:
      title: Close a scan's tab
      say:
      - close that tab
      - get rid of the active tab
      - close the tab of the earlier capture
      done: Tab closed.
    fr:
      title: Fermer l'onglet d'un scan
      say:
      - ferme cet onglet
      - enlève l'onglet actif
      - ferme l'onglet de la capture précédente
      done: Onglet fermé.
- id: scans.cycle_tab
  kind: action
  runs_on: ui
  model: Go to the next or the previous open scan tab (Ctrl+Tab); it needs two or more tabs open.
  args:
    direction:
      type: string
      enum:
      - next
      - prev
      required: true
  needs:
  - session
  - scan
  text:
    es:
      title: Pasar a la pestaña siguiente o anterior
      say:
      - pasá a la pestaña siguiente
      - pestaña anterior
      - rotá entre las pestañas
      done: Escaneo {detail}.
    en:
      title: Next or previous scan tab
      say:
      - go to the next tab
      - previous tab
      - cycle through the tabs
      done: Scan {detail}.
    fr:
      title: Onglet suivant ou précédent
      say:
      - passe à l'onglet suivant
      - onglet précédent
      - fais défiler les onglets
      done: Scan {detail}.
- id: scans.set_reference
  kind: action
  runs_on: ui
  status: manual
  model: 'Mark one scan as the composition reference: the one the others are registered on when fusing, and the
    one shown first when the session is opened.'
  args:
    scan:
      type: string
      description: the scan's date (YYYY-MM-DD) or label
      required: true
  needs:
  - session
  text:
    es:
      title: Usar un escaneo como referencia de composición
      say:
      - usá este como referencia de composición
      - marcá la estrella de esa toma
      - que este sea el de referencia
    en:
      title: Use a scan as the composition reference
      say:
      - use this one as the composition reference
      - star that capture
      - make this one the reference
    fr:
      title: Utiliser un scan comme référence de composition
      say:
      - utilise celui-ci comme référence de composition
      - mets l'étoile sur cette capture
      - que celui-ci soit la référence
- id: scans.fuse
  kind: action
  runs_on: ui
  status: manual
  model: 'LAUNCH the registration and merge from the Fuse window: each chosen scan is registered on the reference
    one through the objects that carry the same label in both, and the merged cloud is built as a new entry of the
    list. Several minutes of server work.'
  confirm: true
  args:
    session:
      type: string
      description: the session's name; omit for the open one
    scans:
      type: array
      items:
        type: string
      description: the scans merged into the reference (date or label)
      required: true
    exclude:
      type: object
      description: per scan, the labels of the object pairs left out of the registration
  needs:
  - session
  text:
    es:
      title: Ejecutar la fusión
      say:
      - registrá y construí la nube fusionada
      - corré el registro de las tomas elegidas
      - lanzala desde su ventana
    en:
      title: Run the fusion
      say:
      - register and build the fused cloud
      - run the registration of the chosen captures
      - launch it from its window
    fr:
      title: Lancer la fusion
      say:
      - recale et construis le nuage fusionné
      - lance le recalage des captures choisies
      - lance-la depuis sa fenêtre
