# --- Server Settings ---
server:
  host: "0.0.0.0"
  port: 8765
  static_dir: "../static"  # Relative to server directory
  chunk_size: 120
  chunk_overlap: 60 # 50% overlap — original DA3 default
  # Derived: chunk_step = chunk_size - chunk_overlap = 60 frames between chunk starts
  frame_stride: 10  # Take 1 every N valid frames (1 = use all, 10 = 1/10th)
                     # Used as FALLBACK when frame_selection.enabled is false

# --- Scene Analysis (VLM Auto-Inventory) ---
# InternVL3 auto-detects object categories from scan frames
# Replaces manual prompt input for segmentation
scene_analysis:
  enabled: true
  model_id: "OpenGVLab/InternVL3-8B"   # MIT license, auto-downloads from HuggingFace
  max_tiles: 6                           # Image tiles (6=dev/12GB, 12=production/24GB+)
  max_merged_categories: 25              # Cap after merge across all frames (was 40)

  # VLM prompt — universal 3D scanning (works for construction, residential, commercial)
  prompt: |
    <image>
    You are a spatial analyst for 3D scanning. Identify every physical object and surface visible.

    Categories to look for:
    - Surfaces: wall, floor, ceiling, staircase
    - Openings: door, window
    - Furniture: chair, table, couch, shelf, cabinet, bed, desk
    - Fixtures: radiator, light fixture, outlet, switch, sink, toilet
    - Installations: pipe, duct, conduit, cable tray, electrical panel
    - Construction: column, beam, slab, rebar, formwork, scaffold
    - Finishes: tile, cladding, insulation, carpet, paint
    - Other: any distinct physical object not listed above

    For each element provide:
    - "label": 1-2 word generic name (lowercase, e.g. "chair", "floor")
    - "sam3_hint": 2-3 word specific phrase to help a segmentation model find it
      (include material, color, or distinguishing feature, e.g. "checkered armchair", "ceramic floor tiles", "white radiator")

    Rules:
    1. Return JSON array: [{"label": "...", "sam3_hint": "..."}, ...]
    2. Max 20 entries — no duplicates, no synonyms
    3. ALWAYS include floor, wall, ceiling if visible
    4. Ignore people, small tools, trash

    Output ONLY the JSON array.

  # Merge prompt for combining detections across frames
  merge_prompt: |
    Merge these object lists from {n_frames} views into one unified inventory.

    {categories_per_frame}

    Rules:
    1. Merge duplicates and synonyms (e.g. "wooden chair" + "chair" = "chair")
    2. Max {max_categories} entries — prioritize items seen in most frames
    3. MANDATORY: floor, wall, ceiling if detected in any frame
    4. Keep the best sam3_hint for each merged category (most specific 2-3 word phrase)
    5. Return JSON array of {{"label": "...", "sam3_hint": "..."}} objects

    Output ONLY the JSON array.

  # Force-inject these categories even if VLM misses them
  required_categories:
    - { label: "floor" }
    - { label: "wall" }
    - { label: "ceiling" }

# --- Frame Selection (Visual Novelty Filter) ---
# ORB-SLAM style H/F ratio keyframe selection (no camera intrinsics needed)
# Replaces fixed frame_stride with intelligent parallax-based selection
frame_selection:
  enabled: true
  max_features: 2000          # ORB features per frame
  sigma: 1.0                  # Reprojection error std dev (pixels)
  process_scale: 0.25         # Process at 25% resolution (speed)
  hf_ratio_threshold: 0.45    # H/(H+F) ratio: < 0.45 = parallax present (ORB-SLAM default)
  min_displacement: 3.0       # Minimum median pixel displacement
  force_accept_interval: 30   # Safety: force accept every N frames even if no parallax

# --- Paths ---
paths:
  # Base directory for DA3 models/weights
  da3_weights_dir: "vendor/depth_anything_3/da3_streaming/weights"  # relative to project root
  # Directory where scan sessions are stored
  scans_dir: "scans"
  # Default output directory name within each session
  output_dir_name: "output"

# --- Depth Anything 3 (DA3) Configuration ---
da3:
  # install_path is now resolved automatically by vendor_paths.py
  install_path: "vendor/depth_anything_3"  # relative to project root

# --- Models ---
models:
  depth:
    # Model Architecture/Name
    # Options: 
    #   - "depth-anything/DA3-LARGE-1.1" (Efficient, fit for RTX 3060)
    #name: "depth-anything/DA3NESTED-GIANT-LARGE-1.1"
    name: "depth-anything/DA3NESTED-GIANT-LARGE-1.1"
    #name: "depth-anything/DA3-LARGE-1.1"
    
    # Device: "cuda" or "cpu"
    device: "cpu" 
    #device: "cuda"
    
    # Use ray-based pose estimation (slower but more accurate, especially indoor)
    use_ray_pose: true
    # Advanced Inference Settings (Formerly Hardcoded)
    inference_precision: "float16"        # float16 or float32
    torch_compile_mode: "reduce-overhead" # reduce-overhead, max-autotune, or default
    ref_view_strategy: "saddle_balanced"  # saddle_balanced, etc.
    

  # DA3 Streaming Specific Settings
  da3:
    loop_chunk_size: 20  # Images of loop chunk = 2 * loop_chunk_size
    depth_threshold: 15.0
    conf_threshold: 1.5   # DA3 internal confidence threshold (vendor default)
    overlap_s: 0          # Overlap start offset (vendor default)
    seed: 42              # Random seed for reproducibility
    pointcloud_save:
      conf_threshold_coef: 0.25    # Lower = keeps more points (0.75 was too aggressive, lost small objects)
      sample_ratio: 1.0
    # Loop closure - SALAD retrieval
    loop_salad:
      image_size: [336, 336]
      batch_size: 32
      similarity_threshold: 0.85
      top_k: 5
      use_nms: true
      nms_threshold: 25
    # Loop closure - SIM3 optimizer
    loop_sim3_optimizer:
      lang_version: "python"
      max_iterations: 30
      lambda_init: 0.000001

  segmentation:
    # SAM3 Model
    model_type: "vit_b" # Options: vit_b, vit_l, vit_h
    device: "cuda"

    # Inference parameters
    keyframe_interval: 2
    max_search_frames: 300
    points_per_side: 32
    pred_iou_thresh: 0.88
    stability_score_thresh: 0.95

    # Prompting Strategy (Formerly Hardcoded)
    prompt_search_frames: [0, 15] # Frames to apply prompt to (Relative to chunk start)
    
    # Batched processing (memory management for long videos)
    batch_size: 50              # Frames per SAM3 session
    batch_overlap: 10           # Overlap between batches for ID continuity
    iou_match_threshold: 0.3    # Min IoU to consider same object across batches
    

# --- Point Cloud Generation ---
point_cloud:
  generation:
    sample_ratio: 1.0
    conf_threshold_coef: 0.75
    keyframe_interval: 2
    min_depth: 0.1
    max_depth: 100.0
    # Dynamic Thresholding Parameters (Formerly Hardcoded)
    dynamic_threshold_coef: 0.1
    dynamic_threshold_min: 0.000001 # 1e-6

# --- Alignment (SIM3 & Auto-Leveling) ---
alignment:
  ransac:
    delta: 0.1
    max_iters: 2000
    tolerance: 1e-9
  
  # Method: "sim3" (re-opt scale) or "scale+se3" (fix scale from ransac)
  method: "scale+se3"
  # Alignment library: "torch" or "numpy"
  align_lib: "torch"
  # Scale computation: "auto", "median", "mean"
  scale_compute_method: "auto"
  # Alignment type: "dense" or "sparse"
  align_type: "dense"
  # Sparse keypoint alignment
  sparse_align:
    keypoint_select: "orb"
    keypoint_num: 5000

  reference_chunk_id: 0

  # Auto-leveling (Floor Detection)
  auto_leveling:
    enabled: true
    ransac_iters: 500
    ransac_threshold: 0.05
    min_points: 100
    sample_ratio: 0.1
    gravity_check_threshold: 0.5
    target_gravity: [0.0, 1.0, 0.0]

# --- Storage & Filtering ---
storage:
  jpeg_quality: 95
  
  outlier_removal:
    enabled: true
    eps: 0.05
    min_samples: 10
    sor_k: 20
    sor_std_ratio: 2.0

# --- Fusion Engine (Visualization) ---
fusion:
  min_depth: 0.1
  max_depth: 50.0
  downsample_factor: 2
  buffer_size: 30
  intrinsics:
    fx: 1000.0
    fy: 1000.0
    cx: 640.0
    cy: 360.0

# --- Visualization Assets ---
visualization:
  segment_colors: [
    "#FFFF00", "#00FF00", "#FF00FF", "#00FFFF", 
    "#FF8000", "#8000FF", "#FF0080", "#0080FF"
  ]

# --- MASt3R-SLAM Configuration ---
mast3r_slam:
  # Installation path
  install_path: "/home/hernan/mast3r_slam"
  
  # Config file (relative to install_path)
  config_file: "config/base.yaml"
  
  # Checkpoint selection (use most accurate model - precision is priority)
  checkpoint:
    # Options:
    # - MASt3R_ViTLarge_BaseDecoder_512_catmlpdpt_metric.pth (most accurate)
    # - MASt3R_ViTLarge_BaseDecoder_512_catmlpdpt_metric_retrieval.pth (with retrieval)
    model_file: "MASt3R_ViTLarge_BaseDecoder_512_catmlpdpt_metric.pth"
    retrieval_file: "MASt3R_ViTLarge_BaseDecoder_512_catmlpdpt_metric_retrieval_trainingfree.pth"
    codebook_file: "MASt3R_ViTLarge_BaseDecoder_512_catmlpdpt_metric_retrieval_codebook.pkl"
  
  # Device configuration
  device: "cuda:0"
  
  # Image processing
  image:
    size: 512  # MASt3R processes images at this resolution
    downsample: 1  # Additional downsampling factor
  
  # Tracking parameters
  tracking:
    keyframe_interval: 10  # Add keyframe every N frames minimum
    min_confidence: 0.3  # Confidence threshold for tracking quality
    reloc_attempts: 5  # Relocalization attempts before giving up
  
  # Point cloud generation
  pointcloud:
    confidence_threshold: 1.0  # Minimum confidence to include point (Higher = less bleeding)
    sample_ratio: 1.0  # Fraction of points to keep (1.0 = full density)
    color_source: "frame"  # "frame" or "texture"
  
  # Calibration
  calibration:
    # If use_intrinsics is false, MASt3R will estimate intrinsics
    use_intrinsics: false
    # Default intrinsics (used when use_intrinsics is true and no calibration file)
    default:
      fx: 1000.0
      fy: 1000.0
      cx: 640.0
      cy: 360.0
    # FOV estimation for uncalibrated mode (degrees)
    assumed_fov: 60.0
  
  # Global optimization
  optimization:
    enabled: true
    loop_closure: true
    retrieval_k: 5  # Number of similar keyframes to retrieve
    retrieval_min_thresh: 0.5  # Minimum similarity for retrieval

# --- BIM/IFC Configuration ---
bim:
  # Supported formats
  supported_formats: [".ifc", ".rvt"]
  
  # Comparison parameters
  comparison:
    # Alignment method: "icp", "manual", "control_points"
    alignment_method: "icp"
    # ICP parameters
    icp_max_iterations: 50
    icp_convergence_threshold: 0.001
    
  # Deviation detection
  deviation:
    # Comparison tolerance (mm) — points within this distance from BIM surface count as "correct"
    tolerance_mm: 50              # 50mm default — the main C2M deviation threshold
    # Method: "point_to_surface", "point_to_point"
    method: "point_to_surface"
    # Display classification thresholds (mm) — for color heatmap only
    warning_threshold: 10.0
    error_threshold: 20.0
    critical_threshold: 30.0
    # Sábana (deviation heatmap) — rendered as colored point cloud
    sabana:
      point_size_mm: 3.0        # Render point size (matches DA3 scan spacing)
      uncovered_alpha: 0.25     # Alpha for non-scanned BIM mesh areas
      subsample_mm: 1.0         # Subsample cloud to this spacing (0 = raw, 1 = DA3 precision)
    # Coverage: "is there construction near this BIM face?" — separate from deviation accuracy
    coverage_proximity_m: 0.15  # 15cm — generous radius for detecting construction presence
                                # Handles thick slabs/walls where scan only sees one side
    # Quality classification thresholds (% of scan points within tolerance)
    quality:
      good_threshold: 80        # >=80% within tolerance = GOOD (green)
      regular_threshold: 50     # >=50% within tolerance = REGULAR (yellow)
                                # <50% = BAD (red) — advance counts as 0

# --- SLAM Backend Selection ---
# Options: "da3", "mast3r", "hybrid", "map"
# - da3: Depth Anything 3 based reconstruction (fast, dense, ~10% RelErr)
# - mast3r: MASt3R-SLAM (metric accurate poses, sparse point cloud)
# - hybrid: MASt3R SLAM for metric poses + DA3 for dense depth (<3cm target)
# - map: MapAnything v2 via VGGT-Long (8x faster, Apache 2.0, ~16% RelErr w/o priors)
slam_backend: map

# --- MapAnything (via VGGT-Long) Configuration ---
mapanything:
  conda_env: "mapanything"             # Conda environment with MapAnything installed
  model_weights: "facebook/map-anything-apache"  # Apache 2.0 (commercial OK)
  device: "cpu"                        # "cpu" or "cuda"
  conf_threshold_coef: 0.75            # Higher = stricter, keeps only high-confidence points
  sample_ratio: 1.0                    # 1.0 = keep all points that pass confidence filter
  chunk_size: 60                       # Frames per VGGT-Long chunk
  chunk_overlap: 30                    # Overlap between chunks for alignment
  reference_frame_mid: true            # Use middle frame as reference (better consistency)
  loop_closure: true                   # Enable SALAD loop closure
  use_keyframes: true                  # Use frame_selector keyframes (recommended)

# --- Hybrid Configuration ---
# MASt3R SLAM (metric poses + loop closure) + DA3 (dense depth, auto-scaled to MASt3R metric)
hybrid:
  # DA3 chunking inherits server.chunk_size and server.chunk_overlap
  # Point cloud params inherit from models.da3.pointcloud_save

# --- Post-Processing (CloudCompPy) ---
# Professional cleaning pipeline for DA3 point clouds
postprocessing:
  enabled: true
  conda_env: "CloudComPy310"
  
  # Step 1: Duplicate removal
  skip_duplicates: false
  
  # Step 2: Statistical Outlier Removal
  skip_sor: false
  sor_knn: 8               # Number of nearest neighbors for SOR (lower = keeps isolated objects)
  sor_sigma: 3.0           # Standard deviation multiplier (higher = keeps more points)
  
  # Step 3: Noise filter — DISABLED (O(n²), hangs on clouds >1M points)
  # SOR already handles outlier removal effectively
  skip_noise: true
  noise_radius: 0.02      # Only usable on small clouds (<500K points)
  noise_sigma: 2.0
  
  # Step 4: Voxel subsampling
  voxel_size: 0.001        # 5mm voxel (keeps cloud under 100M pts)
  max_points: 0            # 0 = unlimited
  
  # Step 5: Normal estimation (slow on big clouds, not needed for point cloud viewer)
  skip_normals: true


# --- Coverage Engine (Tier 1) ---
# Cumulative, occlusion-aware coverage tracking per BIM element
coverage_engine:
  enabled: true
  ray_radius: 0.05            # Cylinder radius (m) for occlusion ray query
  sample_density: 4.0         # BIM surface samples per m²
  completion_threshold: 80.0  # % coverage to mark element COMPLETED
  quality_threshold: 80.0     # % of points within tolerance for COMPLETED
