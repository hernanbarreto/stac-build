name: stac-build
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pytorch>=2.0
  - torchvision
  - torchaudio
  - pytorch-cuda=12.1
  - cuda-toolkit=12.1
  - ninja
  - numpy==1.26.4            # PINNED (docs/plan_determinismo.md 74, 2026-10-07): recorded in the I0/I1 stamp
  - scipy==1.15.3            # PINNED (74): I1's rotation fit
  - pip:
    - ninja
    - jaxtyping
    - websockets>=12.0
    - opencv-python==4.11.0.86   # PINNED (74/79): bundled libjpeg-turbo 3.0.3 decodes the frames (I0/I1/F4)
    - fastapi>=0.104
    - uvicorn[standard]>=0.24
    - python-multipart
    # DA3 dependencies
    - huggingface_hub
    - einops
    - pillow==12.0.0             # PINNED (79): libjpeg-turbo 3.1.2 — DA3 decodes the same frames with it
    - requests
    - typer
    # SAM3 dependencies
    - timm>=1.0.17
    - hydra-core
    - iopath>=0.1.10
    - regex
    - ftfy
    - tqdm
    # Additional dependencies
    - moviepy==1.0.3
    - pycocotools
    - decord
    - psutil
    - addict
    - plyfile
    - matplotlib
    - trimesh
    - evo-1
    - e3nn  # For DA3NESTED spherical harmonics
    # BIM Integration
    - ifcopenshell>=0.7
    - pygltflib>=1.16
    - reportlab>=4.0
    - openpyxl>=3.1
