<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>STAC AR</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; height: 100dvh; overflow: hidden; background: #0b0e11;
               color: #e8eaed;
               font-family: -apple-system, 'Segoe UI', system-ui, sans-serif; }
  button { font: inherit; color: inherit; background: #1c2128; border: 1px solid #30363d;
           border-radius: 10px; padding: 10px 14px; cursor: pointer; }
  button.primary { background: #1f6feb; border-color: #1f6feb; }
  button.active { background: #2ea043; border-color: #2ea043; }
  button:disabled { opacity: .4; }

  /* ── home: session picker ── */
  #home { position: absolute; inset: 0; overflow-y: auto; padding: 18px; z-index: 30; }
  #home h1 { font-size: 20px; margin: 8px 0 2px; }
  #home .sub { color: #8b949e; font-size: 13px; margin-bottom: 16px; }
  .card { background: #12161b; border: 1px solid #262c33; border-radius: 14px;
          padding: 14px; margin-bottom: 12px; }
  .card .name { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .badge { font-size: 11px; padding: 3px 8px; border-radius: 999px; background: #21262d;
           color: #8b949e; }
  .badge.on { background: #123a22; color: #4ade80; }
  .card .row { display: flex; gap: 10px; align-items: center; }
  .card label { font-size: 13px; display: flex; align-items: center; gap: 5px; }
  .card .open { margin-left: auto; }
  #home .empty { color: #8b949e; text-align: center; margin-top: 40px; }

  /* ── viewer ── */
  #viewer { position: absolute; inset: 0; display: none; }
  #canvas-wrap, #canvas-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* overlay = also the WebXR dom-overlay root */
  #overlay { position: absolute; inset: 0; pointer-events: none; z-index: 20; }
  #overlay > * { pointer-events: auto; }
  #topbar { position: absolute; top: 0; left: 0; right: 0; display: flex; gap: 8px;
            padding: 10px; padding-top: calc(10px + env(safe-area-inset-top));
            align-items: center; }
  #topbar .title { font-size: 14px; font-weight: 600; opacity: .9;
                   overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #topbar .spacer { flex: 1; }
  /* Safari's collapsing bottom bar overlays the page — keep the toolbar well
     above it and give it its own contrast strip */
  #toolbar { position: absolute; left: 0; right: 0;
             bottom: calc(26px + env(safe-area-inset-bottom));
             display: flex; gap: 6px; padding: 8px 10px; overflow-x: auto;
             background: linear-gradient(transparent, rgba(8,10,13,.55)); }
  #toolbar button { flex: 0 0 auto; font-size: 14px; padding: 12px 14px; }
  #toast { position: absolute; left: 50%; transform: translateX(-50%);
           bottom: calc(70px + env(safe-area-inset-bottom));
           background: rgba(20, 24, 30, .92); border: 1px solid #30363d; color: #e8eaed;
           padding: 8px 14px; border-radius: 10px; font-size: 13px; max-width: 86%;
           text-align: center; display: none; }
  #loading { position: absolute; inset: 0; display: none; align-items: center;
             justify-content: center; flex-direction: column; gap: 12px;
             background: rgba(11, 14, 17, .85); z-index: 25; }
  .spin { width: 34px; height: 34px; border: 3px solid #30363d; border-top-color: #1f6feb;
          border-radius: 50%; animation: sp 0.9s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }

  /* ── AI chat drawer ── */
  #chat { position: absolute; left: 0; right: 0; bottom: 0; max-height: 62%;
          background: rgba(13, 17, 22, .97); border-top: 1px solid #262c33;
          border-radius: 16px 16px 0 0; display: none; flex-direction: column; z-index: 26; }
  #chat header { display: flex; align-items: center; padding: 10px 14px; gap: 8px; }
  #chat header .t { font-weight: 600; font-size: 14px; }
  #chat header button { margin-left: auto; padding: 6px 10px; }
  #msgs { overflow-y: auto; padding: 0 14px; flex: 1; }
  .msg { margin-bottom: 10px; font-size: 14px; line-height: 1.45; }
  .msg.q { color: #79c0ff; }
  .msg .trace { font-size: 12px; color: #8b949e; margin-top: 4px;
                font-family: ui-monospace, monospace; white-space: pre-wrap; }
  #chatform { display: flex; gap: 8px; padding: 10px 14px;
              padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
  #chatform input { flex: 1; background: #0b0e11; border: 1px solid #30363d;
                    border-radius: 10px; color: #e8eaed; padding: 10px 12px; font-size: 16px; }
</style>
</head>
<body>
  <div id="home">
    <h1>STAC AR</h1>
    <div class="sub">Pick a reconstruction to project in augmented reality</div>
    <div id="cards"><div class="empty">Loading sessions…</div></div>
  </div>

  <div id="viewer">
    <video id="camfeed" autoplay muted playsinline
           style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none"></video>
    <div id="canvas-wrap"></div>
    <div id="overlay">
      <div id="topbar">
        <button id="btn-back">←</button>
        <div class="title" id="v-title"></div>
        <div class="spacer"></div>
        <button id="btn-light" title="toggle lighting">☀</button>
        <button id="btn-scale">1:1</button>
        <button id="btn-ql" class="primary" style="display:none">AR&nbsp;👁</button>
        <button id="btn-ar" class="primary" style="display:none">XR</button>
      </div>
      <div id="toolbar">
        <button data-tool="move">Move</button>
        <button data-tool="dist">Distance</button>
        <button data-tool="angle">Angle</button>
        <button data-tool="vol">Volume</button>
        <button id="btn-clear">Clear</button>
        <button id="btn-chat">AI ✦</button>
      </div>
      <div id="toast"></div>
      <div id="chat">
        <header><div class="t">Spatial AI</div><button id="btn-chat-close">✕</button></header>
        <div id="msgs"></div>
        <form id="chatform">
          <input id="chat-in" type="text" placeholder="Ask about the scene… (e.g. distance between columns)" autocomplete="off">
          <button class="primary">Ask</button>
        </form>
      </div>
      <div id="loading"><div class="spin"></div><div id="loading-msg">Loading…</div></div>
    </div>
  </div>

  <script type="module" src="app.js?v=0d3a1b5f9e"></script>
</body>
</html>
