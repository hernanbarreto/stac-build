<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>STAC XR</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; height: 100dvh; overflow: hidden; background: #000;
               color: #e8eaed;
               font-family: -apple-system, 'Segoe UI', system-ui, sans-serif; }
  #camerafeed { position: absolute; inset: 0; width: 100%; height: 100%; }
  button { font: inherit; color: inherit; background: rgba(28,33,40,.88);
           border: 1px solid #4a5361; border-radius: 10px; padding: 12px 14px;
           font-size: 14px; }
  button.active { background: rgba(46,160,67,.92); border-color: #4ade80; }
  #topbar { position: absolute; top: 0; left: 0; right: 0; display: flex; gap: 8px;
            padding: 10px; padding-top: calc(10px + env(safe-area-inset-top));
            align-items: center; z-index: 10; }
  #topbar .title { font-size: 14px; font-weight: 600; text-shadow: 0 1px 3px #000; }
  #topbar .spacer { flex: 1; }
  #toolbar { position: absolute; left: 0; right: 0;
             bottom: calc(26px + env(safe-area-inset-bottom));
             display: flex; gap: 6px; padding: 8px 10px; overflow-x: auto; z-index: 10; }
  #toast { position: absolute; left: 50%; transform: translateX(-50%);
           bottom: calc(96px + env(safe-area-inset-bottom));
           background: rgba(20,24,30,.92); border: 1px solid #30363d;
           padding: 8px 14px; border-radius: 10px; font-size: 13px; max-width: 86%;
           text-align: center; display: none; z-index: 10; }
  #splash { position: absolute; inset: 0; display: flex; align-items: center;
            justify-content: center; flex-direction: column; gap: 14px;
            background: #0b0e11; z-index: 20; text-align: center; padding: 24px; }
  .spin { width: 34px; height: 34px; border: 3px solid #30363d; border-top-color: #1f6feb;
          border-radius: 50%; animation: sp 0.9s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <canvas id="camerafeed"></canvas>
  <div id="topbar">
    <button id="btn-back">←</button>
    <div class="title" id="v-title">STAC XR</div>
    <div class="spacer"></div>
    <button id="btn-scale">1:10</button>
    <button id="btn-recenter" title="recenter tracking">⟲</button>
  </div>
  <div id="toolbar">
    <button data-tool="move" class="active">Move</button>
    <button data-tool="dist">Distance</button>
    <button data-tool="angle">Angle</button>
    <button data-tool="vol">Volume</button>
    <button id="btn-clear">Clear</button>
  </div>
  <div id="toast"></div>
  <div id="splash">
    <div class="spin"></div>
    <div id="splash-msg">Starting camera + tracking…<br>
      <small>Allow camera and motion access when asked</small></div>
  </div>

  <!-- 8th Wall XR engine (self-hosted binary, SLAM world tracking + absolute
       metric scale — real AR in iOS Safari without WebXR) -->
  <script src="xr8/xr.js" async data-preload-chunks="slam"></script>
  <script type="module" src="ios-app.js?v=dev"></script>
</body>
</html>
